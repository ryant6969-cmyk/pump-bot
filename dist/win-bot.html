/*
VOICE   calm, precise, expensive: a private trading desk, not a casino
IDEA    white quartz and gold: polished stone surfaces, gold only where it matters
PICTURE the gold-ringed Start button on quartz; live scores in gold rings
COLOUR  warm quartz white, pure white cards, gold accents, emerald for real money, red for losses
TYPE    New York (serif) for the brand and titles, SF Pro with tabular numbers for money
*/

:root {
  color-scheme: light;
  --bg: #f4f1ea;
  --card: #ffffff;
  --card2: #f8f6f1;
  --card3: #ece7dc;
  --line: rgba(122, 98, 42, 0.13);
  --line2: rgba(122, 98, 42, 0.24);
  --text: #1c1a16;
  --muted: #6e685c;
  --muted2: #a29a8a;
  --gold: #b08d3e;
  --gold-deep: #8a6a24;
  --gold-soft: rgba(176, 141, 62, 0.12);
  --gold-line: rgba(176, 141, 62, 0.45);
  --gold-grad: linear-gradient(135deg, #f3e2a6 0%, #d8b765 30%, #b38f3f 62%, #e2c57b 100%);
  --gold-text: linear-gradient(120deg, #9a7429 0%, #c9a24c 45%, #8a6a24 100%);
  --green: #1d8a4c;
  --green-dim: rgba(29, 138, 76, 0.1);
  --red: #c4372c;
  --red-dim: rgba(196, 55, 44, 0.08);
  --amber: #b2741c;
  --amber-dim: rgba(178, 116, 28, 0.1);
  --blue: #8a6a24;
  --mode: var(--gold);
  --mode-deep: var(--gold-deep);
  --mode-dim: var(--gold-soft);
  --mode-fill: var(--gold-grad);
  --shadow: 0 1px 2px rgba(70, 55, 20, 0.05), 0 8px 24px rgba(70, 55, 20, 0.06);
  --shadow-lg: 0 2px 6px rgba(70, 55, 20, 0.07), 0 22px 50px rgba(70, 55, 20, 0.12);
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  --tabbar: 58px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --serif: "New York", ui-serif, "Iowan Old Style", "Apple Garamond", Georgia, serif;
}
:root[data-mode="real"] { --mode: var(--green); --mode-deep: #146a39; --mode-dim: var(--green-dim); --mode-fill: linear-gradient(135deg, #2aa862, #1d8a4c 55%, #146a39); }

* { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: transparent; /* the quartz layer below shows through */
  color: var(--text);
  font: 17px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
  overscroll-behavior-y: none;
}
/* quartz: soft light pooling plus faint grey-gold veining */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(120% 60% at 15% -10%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 60%),
    radial-gradient(90% 50% at 110% 30%, rgba(214, 190, 132, 0.16), rgba(214, 190, 132, 0) 65%),
    linear-gradient(118deg, transparent 0 38%, rgba(150, 140, 120, 0.09) 39.2%, transparent 41% 100%),
    linear-gradient(104deg, transparent 0 63%, rgba(176, 141, 62, 0.12) 63.6%, transparent 64.6% 100%),
    linear-gradient(131deg, transparent 0 74%, rgba(150, 140, 120, 0.08) 75%, transparent 77.5% 100%),
    linear-gradient(97deg, transparent 0 18%, rgba(150, 140, 120, 0.07) 19%, transparent 21% 100%),
    linear-gradient(152deg, transparent 0 52%, rgba(176, 141, 62, 0.06) 52.6%, transparent 53.4% 100%),
    linear-gradient(180deg, #faf8f3 0%, #f2eee5 100%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
a { color: var(--gold-deep); text-decoration: none; font-weight: 600; }
.num, .money { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- boot ---------- */
.boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 18px; color: var(--muted); }
.boot-mark { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--card3); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- layout ---------- */
.screen { padding: calc(var(--top) + 8px) 16px calc(var(--tabbar) + var(--bottom) + 24px); max-width: 560px; margin: 0 auto; }
.screen.no-tabs { padding-bottom: calc(var(--bottom) + 28px); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; }
.brand { font: 600 30px/1.1 var(--serif); letter-spacing: -0.01em; margin: 4px 0 0; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; font: 600 11px/1.2 var(--font); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted2); -webkit-text-fill-color: var(--muted2); margin-top: 3px; }
.title { font: 600 32px/1.1 var(--serif); letter-spacing: -0.01em; margin: 6px 0 14px; }
.title.small { font-size: 27px; }
.sub { color: var(--muted); font-size: 15px; margin: -8px 0 16px; }
.section-title { font-size: 12px; color: var(--muted); margin: 26px 4px 8px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; }
.section-title .btn { text-transform: none; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: grid; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mid { font-size: 15px; }
.up { color: var(--green); }
.down { color: var(--red); }
.goldtxt { color: var(--gold-deep); }
.center { text-align: center; }
.mt { margin-top: 12px; }
.mt2 { margin-top: 22px; }

/* ---------- cards ---------- */
.card { background: var(--card); border-radius: 20px; padding: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.card + .card, .alert + .card, .alert + .list { margin-top: 10px; }
.card.tight { padding: 12px 14px; }
.list { background: var(--card); border-radius: 20px; border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; width: 100%; background: none; border: 0; text-align: left; }
.item + .item { border-top: 1px solid var(--line); }
button.item:active, .tap:active { background: var(--card2); }
.item .grow { flex: 1; }
.item .chev { color: var(--muted2); font-size: 20px; line-height: 1; }
.item .val { color: var(--muted); font-size: 15px; text-align: right; }

/* ---------- pills & badges ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: 999px; font-size: 12px; font-weight: 750; letter-spacing: 0.1em; border: 1px solid var(--line2); }
.pill.mode { background: var(--card); color: var(--mode-deep); border-color: var(--mode); box-shadow: 0 0 0 3px var(--mode-dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted2); flex: none; }
.dot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
.dot.warn { background: var(--amber); }
.dot.bad { background: var(--red); }
.badge { font-size: 10.5px; font-weight: 750; padding: 2px 7px; border-radius: 6px; background: var(--card3); color: var(--muted); letter-spacing: 0.06em; vertical-align: 1px; }
.badge.practice { background: var(--gold-soft); color: var(--gold-deep); }
.badge.real { background: var(--green-dim); color: var(--green); }
.badge.gold { background: var(--gold-grad); color: #3d2d08; }
.badge.mayhem { background: #1c1a16; color: #e6c877; }
.badge.copy { background: var(--card2); color: var(--gold-deep); border: 1px solid var(--gold-line); }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 18px; border-radius: 15px; border: 1px solid var(--line2); font-weight: 650; font-size: 17px; background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(70, 55, 20, 0.05); }
.btn:active { transform: scale(0.985); opacity: 0.92; }
.btn.primary { background: #1c1a16; color: #f3e2a6; border-color: #1c1a16; }
.btn.go { background: var(--gold-grad); color: #2e2206; border-color: rgba(138, 106, 36, 0.55); text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); box-shadow: 0 6px 18px rgba(176, 141, 62, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55); }
.btn.mode { background: var(--mode-fill); color: #fff; border-color: transparent; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.15); }
:root:not([data-mode="real"]) .btn.mode { color: #2e2206; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn.danger { background: var(--red-dim); color: var(--red); border-color: rgba(196, 55, 44, 0.25); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--gold-deep); min-height: 44px; border-color: transparent; box-shadow: none; }
.btn.small { min-height: 40px; width: auto; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row.three { grid-template-columns: repeat(3, 1fr); }

/* ---------- Home: balance + power button ---------- */
.balance { padding: 18px 18px 16px; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--gold-grad); opacity: 0.9; }
.balance .label { color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; }
.balance .amount { font: 600 42px/1.1 var(--display); letter-spacing: -0.025em; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.balance .amount small { font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.balance .usd { color: var(--muted); font-size: 15px; }
.today { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); font-size: 14px; }
.chip.up { background: var(--green-dim); color: var(--green); border-color: rgba(29, 138, 76, 0.18); }
.chip.down { background: var(--red-dim); color: var(--red); border-color: rgba(196, 55, 44, 0.18); }

.power-wrap { display: grid; justify-items: center; gap: 14px; padding: 26px 0 6px; }
.power {
  --size: min(54vw, 214px);
  position: relative; width: var(--size); height: var(--size); border-radius: 50%; border: 0; padding: 0;
  background: radial-gradient(circle at 50% 35%, #ffffff 0%, #faf7f0 60%, #efe9dc 100%);
  display: grid; place-content: center; justify-items: center; gap: 4px;
  box-shadow: var(--shadow-lg), inset 0 -6px 16px rgba(120, 96, 40, 0.08), inset 0 2px 0 #fff;
}
.power::before {
  content: ""; position: absolute; inset: -9px; border-radius: 50%; padding: 6px;
  background: var(--gold-grad);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
}
.power::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid var(--line); }
.power .p-label { font: 600 34px/1 var(--serif); color: var(--text); letter-spacing: 0; }
.power .p-sub { font-size: 12px; color: var(--mode-deep); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.power.on::before { background: conic-gradient(from var(--angle, 0deg), #b08d3e, #f3e2a6, #d8b765, #8a6a24, #e2c57b, #b08d3e); animation: sweep 3s linear infinite; }
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes sweep { to { --angle: 360deg; } }
.power:active { transform: scale(0.97); }
.power-status { text-align: center; font-size: 15px; color: var(--muted); max-width: 330px; min-height: 21px; }
.power-status strong { color: var(--text); font-weight: 650; }

.lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.light { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 10px 12px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; box-shadow: var(--shadow); }
.light .row { gap: 7px; color: var(--text); font-weight: 650; font-size: 14px; }

/* ---------- the bot's brain ---------- */
.brain { padding: 14px 14px 10px; }
.brain h3 { margin: 0; font: 600 19px/1.2 var(--serif); }
.funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.funnel div { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.funnel b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.funnel span { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
.funnel div.hi { background: var(--gold-soft); border-color: var(--gold-line); }
.study-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 2px; width: 100%; background: none; border: 0; text-align: left; }
.study-row + .study-row { border-top: 1px solid var(--line); }
.study-row .nm { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.study-row .why { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { height: 3px; border-radius: 2px; background: var(--card3); overflow: hidden; margin-top: 5px; }
.timer i { display: block; height: 100%; background: var(--gold-grad); }

/* score ring */
.score { position: relative; width: 40px; height: 40px; flex: none; }
.score svg { width: 40px; height: 40px; transform: rotate(-90deg); }
.score .trk { fill: none; stroke: var(--card3); stroke-width: 3.2; }
.score .val { fill: none; stroke: var(--gold); stroke-width: 3.2; stroke-linecap: round; }
.score.pass .val { stroke: var(--green); }
.score.fail .val { stroke: var(--muted2); }
.score b { position: absolute; inset: 0; display: grid; place-content: center; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
.score.big { width: 64px; height: 64px; }
.score.big svg { width: 64px; height: 64px; }
.score.big b { font-size: 20px; font-family: var(--serif); }

/* ---------- alerts ---------- */
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 15px; margin-top: 10px; box-shadow: var(--shadow); }
.alert .ico { font-size: 18px; line-height: 1.2; }
.alert.warn { background: #fdf8ec; border-color: rgba(178, 116, 28, 0.28); }
.alert.error { background: #fdf3f1; border-color: rgba(196, 55, 44, 0.25); }
.alert.ok { background: #f1f8f3; border-color: rgba(29, 138, 76, 0.25); }
.alert .grow { flex: 1; }
.alert .btn { margin-top: 10px; }

/* ---------- coin rows ---------- */
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-content: center; font-weight: 800; font-size: 14px; color: #fff; flex: none; letter-spacing: -0.01em; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55), 0 1px 3px rgba(70, 55, 20, 0.18); }
.coin { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 12px; align-items: center; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; }
.coin + .coin { border-top: 1px solid var(--line); }
.coin:active { background: var(--card2); }
.coin .avatar, .coin .score { grid-row: span 2; }
.coin .name { font-weight: 650; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coin .name small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.coin .right { text-align: right; font-size: 15px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.coin .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.coin .status { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coin .status.good { color: var(--green); font-weight: 600; }
.coin .status.gold { color: var(--gold-deep); font-weight: 600; }
.coin .side { display: grid; justify-items: end; gap: 2px; grid-row: span 2; }
.spark { width: 64px; height: 22px; display: block; }
.spark polyline { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark.up polyline { stroke: var(--green); }
.spark.down polyline { stroke: var(--red); }
.spark.flat polyline { stroke: var(--muted2); }
.rail { flex: 1; height: 4px; border-radius: 3px; background: var(--card3); overflow: hidden; min-width: 40px; }
.rail i { display: block; height: 100%; border-radius: 3px; background: var(--gold-grad); }
.change { font-size: 12.5px; font-weight: 650; }
.stage { font-size: 10.5px; font-weight: 750; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; background: var(--card3); color: var(--muted); }
.stage.study { background: var(--gold-soft); color: var(--gold-deep); }
.stage.pass, .stage.bought { background: var(--green-dim); color: var(--green); }
.stage.reject { background: var(--red-dim); color: var(--red); }

/* ---------- study report (coin sheet) ---------- */
.report { display: grid; gap: 8px; margin-top: 12px; }
.bar-line { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.bar-line .meter { grid-column: 1 / 3; height: 6px; border-radius: 4px; background: var(--card3); overflow: hidden; }
.bar-line .meter i { display: block; height: 100%; border-radius: 4px; background: var(--gold-grad); }
.bar-line .pts { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.reasons { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.reasons li { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; }
.reasons li::before { content: "✕"; color: var(--red); font-weight: 800; flex: none; }
.reasons li.good::before { content: "✓"; color: var(--green); }
.verdict { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); margin-top: 12px; }
.verdict h4 { margin: 0 0 2px; font: 600 18px/1.2 var(--serif); }

/* ---------- positions ---------- */
.posrow { gap: 10px; padding-right: 12px; }
.posrow .tap-area { display: flex; align-items: center; gap: 12px; flex: 1; background: none; border: 0; text-align: left; padding: 0; min-height: 44px; }
.posrow .tap-area .grow { flex: 1; }
.posrow .val { text-align: right; }
.sellbtn { min-height: 38px; padding: 0 14px; flex: none; }
.sellrow { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; margin-top: 12px; }
.sellrow .btn { width: 100%; padding: 0 8px; }
.btn.danger.strong { background: var(--red); color: #fff; border-color: var(--red); }
.pos { padding: 14px; }
.pos .top { display: flex; align-items: center; gap: 12px; }
.pos .pnl { font: 650 23px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.pos .pnl small { display: block; font: 500 13px/1.4 var(--font); color: var(--muted); }
.pos .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.fact { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.fact b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.fact span { font-size: 11.5px; color: var(--muted); }
.pos .state { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pos .actions { display: flex; gap: 8px; margin-top: 12px; }

/* ---------- wallets ---------- */
.wallet { padding: 14px; }
.wallet .head { display: flex; align-items: center; gap: 12px; }
.wallet .who { font-weight: 700; font-size: 16px; }
.wallet .addr { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.wallet .copybox { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); display: grid; gap: 10px; }
.wallet .copybox.on { background: linear-gradient(180deg, #fffaf0, #fbf3e0); border-color: var(--gold-line); }
.wtrades { margin-top: 10px; display: grid; }
.wtrade { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; font-size: 14px; }
.wtrade + .wtrade { border-top: 1px solid var(--line); }
.wtrade .side { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 3px 7px; border-radius: 6px; }
.wtrade .side.b { background: var(--green-dim); color: var(--green); }
.wtrade .side.s { background: var(--red-dim); color: var(--red); }
.wtrade .note { font-size: 12px; color: var(--muted); }
.wtrade .note.gold { color: var(--gold-deep); font-weight: 600; }
.wtrade time { font-size: 12px; color: var(--muted2); text-align: right; }

/* ---------- segmented ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card3); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(70, 55, 20, 0.14), 0 0 0 1px var(--gold-line); }

/* ---------- forms ---------- */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); padding-left: 4px; }
.input { width: 100%; min-height: 50px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; font-size: 16px; outline: none; box-shadow: inset 0 1px 2px rgba(70, 55, 20, 0.04); }
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
textarea.input { min-height: 96px; resize: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
.secret { background: var(--card2); border: 1px dashed var(--gold-line); border-radius: 14px; padding: 14px; position: relative; }
.secret.hidden-key .mono { filter: blur(6px); -webkit-user-select: none; user-select: none; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; }
.check input { width: 24px; height: 24px; accent-color: var(--gold); flex: none; margin: 0; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 31px; background: var(--card3); transition: background 0.2s; box-shadow: inset 0 0 0 1px var(--line); }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform 0.2s; box-shadow: 0 2px 4px rgba(70, 55, 20, 0.25); }
.switch input:checked + span { background: var(--gold-grad); }
.switch input:checked + span::after { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper input { width: 86px; min-height: 40px; text-align: center; padding: 6px; border-radius: 10px; background: var(--card); border: 1px solid var(--line2); font-size: 16px; }

/* ---------- wizard ---------- */
.wiz { min-height: 100dvh; display: flex; flex-direction: column; }
.wiz .steps { display: flex; gap: 6px; margin: 10px 0 22px; }
.wiz .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--card3); }
.wiz .steps i.on { background: var(--gold-grad); }
.wiz .body { flex: 1; }
.wiz .foot { display: grid; gap: 10px; padding-top: 18px; }
.hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 18px 0 8px; }
.hero h1 { font: 600 42px/1.05 var(--serif); letter-spacing: -0.01em; margin: 10px 0 0; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }

.point .n { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-grad); color: #2e2206; display: grid; place-content: center; font-weight: 750; font-size: 14px; flex: none; }
.point p { margin: 0; font-size: 15px; color: var(--muted); }
.point strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 2px; }
.style-card { display: grid; gap: 6px; padding: 16px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); text-align: left; width: 100%; box-shadow: var(--shadow); }
.style-card.on { border-color: var(--gold); background: linear-gradient(180deg, #fffdf7, #fbf4e3); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow); }

.style-card p { margin: 0; color: var(--muted); font-size: 14px; }
.style-card .nums { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.style-card .nums span { font-size: 12px; background: var(--card2); border: 1px solid var(--line); padding: 4px 8px; border-radius: 8px; color: var(--text); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(var(--bottom) + 4px);
  background: rgba(252, 250, 246, 0.86); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar button { display: grid; justify-items: center; gap: 2px; border: 0; background: none; color: var(--muted2); font-size: 10.5px; font-weight: 650; min-height: 48px; padding-top: 4px; position: relative; letter-spacing: 0.01em; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--gold-deep); }
.tabbar button .count { position: absolute; top: 0; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold-grad); color: #2e2206; font-size: 11px; font-weight: 800; display: grid; place-content: center; padding: 0 5px; }

/* ---------- sheets & dialogs ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(40, 34, 20, 0.32); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); z-index: 40; animation: fade 0.2s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: calc(100dvh - var(--top) - 10px);
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  background: linear-gradient(180deg, #fffefb, #f8f5ee); border-radius: 24px 24px 0 0; border-top: 1px solid var(--gold-line);
  padding: 8px 18px calc(var(--bottom) + 22px); max-width: 640px; margin: 0 auto;
  box-shadow: 0 -10px 40px rgba(70, 55, 20, 0.15);
  animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--card3); margin: 4px auto 12px; }
.sheet h2 { font: 600 24px/1.2 var(--serif); margin: 0 0 6px; }
.sheet .lead { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.dialog { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 40px)); background: #fffefb; border-radius: 22px; padding: 20px; border: 1px solid var(--gold-line); box-shadow: var(--shadow-lg); animation: pop 0.2s ease; }
.dialog h3 { margin: 0 0 8px; font: 600 20px/1.25 var(--serif); }
.dialog p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.dialog-back { z-index: 50; }
@keyframes rise { from { transform: translateY(40%); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: translate(-50%, -46%); opacity: 0; } }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 0; right: 0; top: calc(var(--top) + 6px); z-index: 60; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 14px; }
.toast { pointer-events: auto; max-width: 440px; width: 100%; background: rgba(255, 254, 251, 0.97); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--gold-line); border-radius: 16px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); animation: drop 0.25s ease; }
.toast.win { border-color: rgba(29, 138, 76, 0.5); }
.toast.loss, .toast.error { border-color: rgba(196, 55, 44, 0.45); }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }

/* ---------- activity ---------- */
.act { display: flex; gap: 12px; padding: 11px 16px; align-items: flex-start; font-size: 15px; }
.act + .act { border-top: 1px solid var(--line); }
.act .dot { margin-top: 7px; }
.act .grow { flex: 1; }
.act time { color: var(--muted2); font-size: 13px; white-space: nowrap; }
.dot.buy { background: var(--gold); }
.dot.win { background: var(--green); }
.dot.loss, .dot.error { background: var(--red); }
.dot.info, .dot.skip { background: var(--muted2); }
.dot.warn { background: var(--amber); }

.empty { text-align: center; color: var(--muted); padding: 28px 18px; font-size: 15px; }
.empty b { display: block; color: var(--text); font: 600 18px/1.3 var(--serif); margin-bottom: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 10px 12px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.help p { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.help h3 { font: 600 18px/1.3 var(--serif); margin: 18px 0 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
@media (min-width: 700px) {
  .sheet { border-radius: 24px; bottom: 20px; }
}

// Rent for the token account (refunded when the bot closes it after selling),
// pump.fun's one-time volume account, network fee and margin. 0.008 SOL max.
const BUY_EXTRA_ALLOWANCE = 8_000_000n;
const FEE_ALLOWANCE = 300_000n; // base + priority fee margin when nothing else is paid
const MAX_CU = 400_000;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class TradeError extends Error {
  /** kind: slippage | graduated | waiting | funds | unsupported | network | guard | expired | failed | gone */
  constructor(message, { kind = 'failed', sig = null, detail = null } = {}) {
    super(message);
    this.name = 'TradeError';
    this.kind = kind;
    this.sig = sig;
    this.detail = detail;
  }
}

/** Plain-English meaning of a Solana transaction error. */
function explainTxError(err, programAt = () => null) {
  if (!err) return null;
  if (typeof err === 'string') {
    if (/InsufficientFunds|AccountNotFound/.test(err)) return { kind: 'funds', message: 'Not enough SOL in the bot wallet for this trade plus fees.' };
    if (/BlockhashNotFound/.test(err)) return { kind: 'expired', message: 'The network was busy. Trying again.' };
    return { kind: 'failed', message: 'The network rejected the trade (' + err + ').' };
  }
  const ie = err.InstructionError;
  if (Array.isArray(ie)) {
    const [idx, inner] = ie;
    const program = programAt(idx);
    const code = inner && typeof inner === 'object' && 'Custom' in inner ? inner.Custom : null;
    if (program === pump.PUMP) {
      if (code === 6002 || code === 6042) return { kind: 'slippage', message: 'The price jumped before the buy landed.' };
      if (code === 6003) return { kind: 'slippage', message: 'The price dropped before the sell landed.' };
      if (code === 6005 || code === 6081) return { kind: 'graduated', message: 'This coin just moved from pump.fun to PumpSwap.' };
      if (code === 6021) return { kind: 'unsupported', message: 'This coin is about to graduate. Skipping the buy.' };
      if (code === 6094) return { kind: 'unsupported', message: "This coin type can't be traded by the bot." };
      if (code === 6040 || code === 6041) return { kind: 'funds', message: 'Not enough SOL for this trade plus fees.' };
      if (code === 6023) return { kind: 'gone', message: 'The wallet no longer holds these tokens.' };
    }
    if (program === pump.PUMP_AMM) {
      if (code === 6004 || code === 6040) return { kind: 'slippage', message: 'The price moved before the trade landed.' };
      if (code === 6020 || code === 6021) return { kind: 'waiting', message: 'PumpSwap has trading paused for this coin. Will retry.' };
      if (code === 6079) return { kind: 'unsupported', message: "This coin type can't be traded by the bot." };
    }
    if (program === SYSTEM_PROGRAM && code === 1) return { kind: 'funds', message: 'Not enough SOL in the bot wallet.' };
    if ((program === pump.TOKEN || program === pump.TOKEN_2022) && code === 1) return { kind: 'gone', message: 'The wallet no longer holds these tokens.' };
    if (inner === 'InsufficientFunds' || inner === 'InsufficientFundsForRent') return { kind: 'funds', message: 'Not enough SOL in the bot wallet.' };
    return { kind: 'failed', message: 'The trade failed on-chain' + (code !== null ? ` (error ${code})` : '') + '.' };
  }
  if (err.InsufficientFundsForRent) return { kind: 'funds', message: 'Not enough SOL left to cover account rent.' };
  return { kind: 'failed', message: 'The trade failed on-chain.' };
}

class Trader {
  constructor({ rpc, wallet, onPending = () => {}, onSettled = () => {}, log = () => {}, fetchImpl, timing = {} } = {}) {
    this.timing = { pollMs: 800, resendMs: 2000, heightCheckMs: 4000, giveUpMs: 120000, detailsRetryMs: 700, expiryRecheckMs: 1500, ...timing };
    this.rpc = rpc;
    this.wallet = wallet;
    this.onPending = onPending;
    this.onSettled = onSettled;
    this.log = log;
    this.fetch = fetchImpl || ((...a) => globalThis.fetch(...a));
    this.blockhash = null;
    this.feeCache = new Map();
    this.pumpPortalWorks = null; // null = untested
  }

  // ---------- reads ----------

  async getAccounts(addresses) {
    const res = await this.rpc.call('getMultipleAccounts', [addresses, { encoding: 'base64', commitment: 'confirmed' }]);
    return res.value.map((a) => (a ? { data: fromBase64(a.data[0]), owner: a.owner, lamports: BigInt(a.lamports) } : null));
  }

  async getBalance() {
    const r = await this.rpc.call('getBalance', [this.wallet.address, { commitment: 'confirmed' }]);
    return BigInt(r.value);
  }

  /** Live curve + token program for a coin. */
  async coinState(mint) {
    const curveAddr = await pump.bondingCurveAddress(mint);
    const [curveAcc, mintAcc] = await this.getAccounts([curveAddr, mint]);
    if (!mintAcc) throw new TradeError("That coin address doesn't exist on Solana.", { kind: 'unsupported' });
    const tokenProgram = mintAcc.owner;
    if (tokenProgram !== pump.TOKEN && tokenProgram !== pump.TOKEN_2022) throw new TradeError("That address isn't a coin.", { kind: 'unsupported' });
    const curve = curveAcc && curveAcc.owner === pump.PUMP ? pump.decodeBondingCurve(curveAcc.data) : null;
    return { curve, curveAddr, tokenProgram, mintInfo: pump.decodeMint(mintAcc.data) };
  }

  async walletTokens() {
    const out = [];
    for (const programId of [pump.TOKEN, pump.TOKEN_2022]) {
      const r = await this.rpc.call('getTokenAccountsByOwner', [this.wallet.address, { programId }, { encoding: 'jsonParsed', commitment: 'confirmed' }]);
      for (const it of r.value || []) {
        const info = it.account?.data?.parsed?.info;
        if (!info?.mint || !info.tokenAmount) continue;
        out.push({ ata: it.pubkey, mint: info.mint, amount: BigInt(info.tokenAmount.amount), tokenProgram: programId });
      }
    }
    return out;
  }

  async _blockhash() {
    if (this.blockhash && Date.now() - this.blockhash.at < 15000) return this.blockhash;
    const r = await this.rpc.call('getLatestBlockhash', [{ commitment: 'confirmed' }]);
    this.blockhash = { blockhash: r.value.blockhash, lastValidBlockHeight: r.value.lastValidBlockHeight, at: Date.now() };
    return this.blockhash;
  }

  async priorityPrice(speed, writableAccounts = []) {
    const s = SPEEDS[speed] || SPEEDS.fast;
    const key = speed + '|' + writableAccounts.join(',');
    const hit = this.feeCache.get(key);
    if (hit && Date.now() - hit.at < 10000) return hit.price;
    let price = s.microLamports;
    try {
      const fees = await this.rpc.call('getRecentPrioritizationFees', [writableAccounts.slice(0, 64)], { retries: 0, timeoutMs: 5000 });
      const vals = (fees || []).map((f) => Number(f.prioritizationFee)).filter((v) => v > 0).sort((a, b) => a - b);
      if (vals.length) price = Math.max(price, Math.min(vals[Math.floor(vals.length * 0.75)], s.maxMicroLamports));
    } catch { /* use the default for this speed */ }
    price = Math.round(price);
    this.feeCache.set(key, { price, at: Date.now() });
    return price;
  }

  // ---------- trades ----------

  async buy({ mint, lamports, slippagePct = 15, speed = 'fast' }) {
    lamports = BigInt(lamports);
    const user = this.wallet.address;
    const st = await this.coinState(mint);
    const c = st.curve;
    if (!c) throw new TradeError("This isn't a pump.fun coin (or it's very old).", { kind: 'unsupported' });
    if (c.complete) throw new TradeError('This coin already graduated to PumpSwap. The bot only buys coins still on pump.fun.', { kind: 'unsupported' });
    if (!pump.isSolPaired(c) || c.depth > 0) throw new TradeError("This coin isn't paired with SOL. The bot only trades SOL coins.", { kind: 'unsupported' });
    if (c.isCashbackCoin) throw new TradeError("This coin type can't be traded by the bot.", { kind: 'unsupported' });
    const expected = pump.curveBuyTokensOut(c, lamports);
    if (expected <= 0n) throw new TradeError('Nothing left to buy on this coin.', { kind: 'unsupported' });
    const minOut = (expected * BigInt(Math.round((100 - slippagePct) * 100))) / 10000n;
    const acc = await pump.curveTradeAccounts(user, mint, st.tokenProgram);
    const core = [
      pump.createAtaIdempotent(user, acc.associatedBaseUser, user, mint, st.tokenProgram),
      pump.buyExactQuoteInV3Ix(acc.keys, lamports, minOut > 0n ? minOut : 1n),
    ];
    const expect = { side: 'buy', maxSolDecrease: lamports + BUY_EXTRA_ALLOWANCE, minTokenIncrease: minOut > 0n ? minOut : 1n };
    // No fallback for buys: if the direct buy fails, the bot simply doesn't buy.
    const r = await this._execute({ kind: 'buy', mint, speed, core, tokenAccount: acc.associatedBaseUser, writable: [acc.bondingCurve], expect });
    return { ...r, tokenProgram: st.tokenProgram, ata: acc.associatedBaseUser, via: 'pump.fun' };
  }

  /** Sell `amount` raw tokens (or everything when amount is null). */
  async sell({ mint, tokenProgram, amount = null, slippagePct = 25, speed = 'fast', allowFallback = true }) {
    const user = this.wallet.address;
    const st = await this.coinState(mint);
    tokenProgram = st.tokenProgram || tokenProgram;
    const ata = await associatedTokenAddress(user, mint, tokenProgram);
    const [tokAcc] = await this.getAccounts([ata]);
    const held = tokAcc ? pump.decodeTokenAccount(tokAcc.data)?.amount ?? 0n : 0n;
    if (held <= 0n) throw new TradeError('The wallet has none of this coin left.', { kind: 'gone' });
    const qty = amount === null || BigInt(amount) > held ? held : BigInt(amount);
    const slipBps = BigInt(Math.round((100 - slippagePct) * 100));
    const c = st.curve;
    let core, writable, expectedOut, venue;
    if (c && !c.complete) {
      expectedOut = pump.curveSellLamportsOut(c, qty);
      const minOut = (expectedOut * slipBps) / 10000n;
      const acc = await pump.curveTradeAccounts(user, mint, tokenProgram);
      core = [pump.sellV3Ix(acc.keys, qty, minOut)];
      writable = [acc.bondingCurve];
      venue = 'pump.fun';
    } else {
      const pool = await pump.canonicalPoolAddress(mint);
      const [poolAcc] = await this.getAccounts([pool]);
      const ps = poolAcc && poolAcc.owner === pump.PUMP_AMM ? pump.decodePool(poolAcc.data) : null;
      if (!ps) throw new TradeError('This coin is moving to PumpSwap. The bot will sell as soon as it opens.', { kind: 'waiting' });
      if (ps.isCashbackCoin) throw new TradeError("This coin type can't be sold by the bot. Import the wallet into Phantom to sell it.", { kind: 'unsupported' });
      const [baseAcc, quoteAcc] = await this.getAccounts([ps.poolBaseTokenAccount, ps.poolQuoteTokenAccount]);
      const baseReserve = pump.decodeTokenAccount(baseAcc?.data)?.amount ?? 0n;
      const quoteReserve = (pump.decodeTokenAccount(quoteAcc?.data)?.amount ?? 0n) + ps.virtualQuoteReserves;
      expectedOut = pump.poolSellLamportsOut(baseReserve, quoteReserve, qty);
      if (expectedOut <= 0n) throw new TradeError("Couldn't price this coin on PumpSwap right now. Will retry.", { kind: 'waiting' });
      const minOut = (expectedOut * slipBps) / 10000n;
      const a = await pump.ammSellAccounts(user, mint, tokenProgram, pool, ps);
      core = [
        pump.createAtaIdempotent(user, a.userQuote, user, pump.WSOL, pump.TOKEN),
        pump.ammSellV2Ix(a.keys, qty, minOut),
        pump.closeTokenAccount(a.userQuote, user, user, pump.TOKEN),
      ];
      writable = [pool];
      venue = 'PumpSwap';
    }
    const minGain = (expectedOut * slipBps) / 10000n;
    const expect = { side: 'sell', maxTokenDecrease: qty, minSolIncrease: minGain - FEE_ALLOWANCE - 3_000_000n };
    try {
      const r = await this._execute({ kind: 'sell', mint, speed, core, tokenAccount: ata, writable, expect });
      return { ...r, tokensSold: qty, via: venue, tokenProgram, ata };
    } catch (e) {
      if (!allowFallback || !this._shouldFallback(e)) throw e;
      // Last resort so a coin never gets stuck: PumpPortal's builder, under strict checks.
      this.log('warn', 'Direct sell failed (' + e.message + '). Trying PumpPortal.');
      const r = await this._viaPumpPortalSell({
        mint, qty, expectedOut, tokenAccount: ata,
        minOutRequired: (minGain * 9n) / 10n,
        body: { publicKey: user, action: 'sell', mint, amount: qty === held ? '100%' : String(Number(qty) / 10 ** pump.TOKEN_DECIMALS), denominatedInSol: 'false', slippage: slippagePct, priorityFee: 0.0005, pool: 'auto' },
      });
      return { ...r, tokensSold: qty, via: 'PumpPortal', tokenProgram, ata };
    }
  }

  /** Send SOL from the bot wallet to another wallet. */
  async withdraw({ to, lamports }) {
    lamports = BigInt(lamports);
    if (lamports <= 0n) throw new TradeError('Nothing to send.', { kind: 'funds' });
    const core = [systemTransfer(this.wallet.address, to, lamports)];
    return this._execute({ kind: 'withdraw', mint: null, speed: 'normal', core, tokenAccount: null, writable: [], cuLimit: 3000,
      expect: { side: 'withdraw', maxSolDecrease: lamports + FEE_ALLOWANCE } });
  }

  /** Close an empty token account to get its rent (~0.002 SOL) back. Best effort. */
  async closeEmptyTokenAccount(mint, tokenProgram) {
    const user = this.wallet.address;
    const ata = await associatedTokenAddress(user, mint, tokenProgram);
    const [acc] = await this.getAccounts([ata]);
    if (!acc) return null;
    const t = pump.decodeTokenAccount(acc.data);
    if (!t || t.amount !== 0n) return null;
    const core = [pump.closeTokenAccount(ata, user, user, tokenProgram)];
    return this._execute({ kind: 'close', mint, speed: 'normal', core, tokenAccount: null, writable: [], cuLimit: 10000,
      expect: { side: 'close', maxSolDecrease: FEE_ALLOWANCE } });
  }

  _shouldFallback(e) {
    if (e?.sent) return false; // our own transaction already went out: never risk a second sale
    if (e?.name === 'RpcError') return false; // connection problem: PumpPortal needs it too
    if (!(e instanceof TradeError)) return true;
    // Only when our own transaction failed its test-run for a reason we don't recognise
    // (for example after a pump.fun program upgrade).
    return e.kind === 'failed' && !e.sig;
  }

  // ---------- the shared pipeline ----------

  async _snapshot(tokenAccount) {
    const addrs = [this.wallet.address, ...(tokenAccount ? [tokenAccount] : [])];
    const accs = await this.getAccounts(addrs);
    const tok = tokenAccount ? accs[1] : null;
    return {
      lamports: accs[0]?.lamports ?? 0n,
      owner: accs[0]?.owner ?? SYSTEM_PROGRAM,
      tokens: tok ? pump.decodeTokenAccount(tok.data)?.amount ?? 0n : 0n,
      tokenExists: !!tok,
      tokenLamports: tok ? tok.lamports : 0n,
    };
  }

  async _simulate(txBytes, tokenAccount) {
    const addresses = [this.wallet.address, ...(tokenAccount ? [tokenAccount] : [])];
    const r = await this.rpc.call('simulateTransaction', [toBase64(txBytes), {
      encoding: 'base64', sigVerify: false, replaceRecentBlockhash: true, commitment: 'processed',
      accounts: { encoding: 'base64', addresses },
    }]);
    const v = r.value || {};
    const w = v.accounts?.[0];
    const t = tokenAccount ? v.accounts?.[1] : null;
    const post = {
      lamports: w ? BigInt(w.lamports) : null,
      owner: w ? w.owner : null,
      tokens: t ? pump.decodeTokenAccount(fromBase64(t.data[0]))?.amount ?? 0n : 0n,
    };
    return { err: v.err || null, logs: v.logs || [], unitsConsumed: Number(v.unitsConsumed || 0), post };
  }

  /** Refuse anything that would move more SOL or tokens than the trade should. */
  _guard(pre, post, expect, priorityLamports) {
    if (post.lamports === null) throw new TradeError('Safety check could not read the wallet. Trade cancelled.', { kind: 'guard' });
    // the wallet must still be a normal wallet afterwards (nothing may reassign it)
    if (post.owner && post.owner !== SYSTEM_PROGRAM) throw new TradeError('Safety check: this transaction would change who controls the wallet. Cancelled.', { kind: 'guard' });
    const solDelta = post.lamports - pre.lamports; // negative = SOL leaves the wallet
    const tokDelta = post.tokens - pre.tokens;
    const feeRoom = priorityLamports + FEE_ALLOWANCE;
    if (expect.maxSolDecrease !== undefined && -solDelta > expect.maxSolDecrease + feeRoom) {
      throw new TradeError(`Safety check: this trade would take ${(Number(-solDelta) / 1e9).toFixed(4)} SOL, more than expected. Cancelled.`, { kind: 'guard' });
    }
    if (expect.minTokenIncrease !== undefined && tokDelta < expect.minTokenIncrease) {
      throw new TradeError('Safety check: the buy would deliver fewer coins than allowed. Cancelled.', { kind: 'guard' });
    }
    if (expect.maxTokenDecrease !== undefined && -tokDelta > expect.maxTokenDecrease) {
      throw new TradeError('Safety check: the sell would remove more coins than asked. Cancelled.', { kind: 'guard' });
    }
    if (expect.minSolIncrease !== undefined && solDelta < expect.minSolIncrease - feeRoom) {
      throw new TradeError('Safety check: the sell would pay out less SOL than allowed. Cancelled.', { kind: 'guard' });
    }
    return { solDelta, tokDelta };
  }

  async _execute({ kind, mint, speed, core, tokenAccount, writable, expect, cuLimit = null }) {
    const user = this.wallet.address;
    const [bh, pre, price] = await Promise.all([this._blockhash(), this._snapshot(tokenAccount), this.priorityPrice(speed, writable)]);
    const build = (limit) => buildLegacyTransaction({
      payer: user, recentBlockhash: bh.blockhash,
      instructions: [setComputeUnitLimit(limit), setComputeUnitPrice(price), ...core],
    });
    const programAt = (txBytes) => {
      const p = parseTransaction(txBytes);
      return (i) => p.staticKeys[p.instructions[i]?.programIdIndex] ?? null;
    };
    const testTx = build(cuLimit || MAX_CU);
    const sim = await this._simulate(testTx, tokenAccount);
    if (sim.err) {
      const x = explainTxError(sim.err, programAt(testTx));
      throw new TradeError(x.message, { kind: x.kind, detail: { err: sim.err, logs: sim.logs.slice(-12) } });
    }
    const units = cuLimit || Math.min(MAX_CU, Math.max(30_000, Math.ceil(sim.unitsConsumed * 1.2) + 15_000));
    const priorityLamports = BigInt(Math.ceil((units * price) / 1e6));
    this._guard(pre, sim.post, expect, BigInt(Math.ceil((MAX_CU * price) / 1e6)));
    const tx = build(units);
    const signed = await signTransaction(tx, this.wallet);
    return this._sendAndSettle({ kind, mint, signed, lastValidBlockHeight: bh.lastValidBlockHeight, pre, tokenAccount, programAt: programAt(tx), priorityLamports });
  }

  async _viaPumpPortalSell({ mint, qty, expectedOut, minOutRequired, tokenAccount, body }) {
    const user = this.wallet.address;
    const guard = (why) => new TradeError('Safety check: PumpPortal\'s transaction ' + why + '. Cancelled.', { kind: 'guard' });
    let res;
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl?.abort(), 10000);
    try {
      res = await this.fetch(PUMPPORTAL_TRADE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl?.signal });
    } catch {
      this.pumpPortalWorks = false;
      throw new TradeError("Couldn't reach PumpPortal from this phone.", { kind: 'network' });
    } finally {
      clearTimeout(timer);
    }
    if (res.status !== 200) throw new TradeError('PumpPortal refused the trade (' + res.status + ').', { kind: 'failed' });
    const bytes = new Uint8Array(await res.arrayBuffer());
    this.pumpPortalWorks = true;
    let p;
    try { p = parseTransaction(bytes); } catch { throw guard('is unreadable'); }
    if (p.header.numRequiredSignatures !== 1 || p.staticKeys[0] !== user) throw guard('needs another signer');
    if (p.lookups.length) throw guard("uses account tables the bot can't check");
    // Every instruction must be one of a few exact shapes.
    const key = (ix, i) => { const k = ix.accountIndexes[i]; return k !== undefined && k < p.staticKeys.length ? p.staticKeys[k] : null; };
    let sells = 0, creates = 0, transfers = 0, transferred = 0n, cuLimit = 200_000n, cuPrice = 0n;
    for (const ix of p.instructions) {
      const prog = p.staticKeys[ix.programIdIndex];
      const d = ix.data;
      if (prog === COMPUTE_BUDGET_PROGRAM) {
        if (d[0] === 2 && d.length === 5) cuLimit = BigInt(readU32(d, 1));
        else if (d[0] === 3 && d.length === 9) cuPrice = readU64(d, 1);
        else if (!(d[0] === 4 && d.length === 5)) throw guard('has an unexpected compute setting');
      } else if (prog === SYSTEM_PROGRAM) {
        if (d.length !== 12 || readU32(d, 0) !== 2 || key(ix, 0) !== user) throw guard('has an unexpected system instruction');
        transferred += readU64(d, 4);
        transfers++;
      } else if (prog === pump.ATA_PROGRAM) {
        if (!(d.length === 0 || (d.length === 1 && (d[0] === 0 || d[0] === 1)))) throw guard('has an unexpected account instruction');
        if (key(ix, 0) !== user || key(ix, 2) !== user) throw guard('creates an account for someone else');
        creates++;
      } else if (prog === pump.TOKEN || prog === pump.TOKEN_2022) {
        if (d.length === 1 && d[0] === 9) { if (key(ix, 1) !== user || key(ix, 2) !== user) throw guard('closes an account to someone else'); }
        else if (!(d.length === 1 && d[0] === 17)) throw guard('moves tokens in an unexpected way');
      } else if (prog === pump.PUMP || prog === pump.PUMP_AMM) {
        const shape = (prog === pump.PUMP ? PUMP_SELLS : AMM_SELLS).get(Array.from(d.subarray(0, 8)).join(','));
        if (!shape || d.length < 24 || ix.accountIndexes.length < shape.min) throw guard('is not a plain sell');
        if (key(ix, shape.user) !== user || key(ix, shape.mint) !== mint) throw guard('sells the wrong coin or for someone else');
        const amount = readU64(d, 8), minOut = readU64(d, 16);
        if (amount <= 0n || amount > qty) throw guard('sells more than asked');
        if (minOut < minOutRequired) throw guard('has no price protection');
        sells++;
      } else if (prog !== MEMO_PROGRAM) {
        throw guard('calls an unknown program');
      }
    }
    if (sells !== 1 || creates > 2 || transfers > 2) throw guard('has an unexpected shape');
    if (transferred > (expectedOut * 6n) / 1000n + 500_000n) throw guard('takes too big a fee');
    if ((cuLimit * cuPrice) / 1_000_000n > 10_000_000n) throw guard('pays too big a network fee');
    // A normal recent blockhash (rules out transactions that never expire).
    const valid = await this.rpc.call('isBlockhashValid', [p.recentBlockhash, { commitment: 'confirmed' }]).catch(() => null);
    if (valid?.value !== true) throw guard('has an unusual or stale blockhash');
    const pre = await this._snapshot(tokenAccount);
    const sim = await this._simulate(bytes, tokenAccount);
    const programAt = (i) => p.staticKeys[p.instructions[i]?.programIdIndex] ?? null;
    if (sim.err) {
      const x = explainTxError(sim.err, programAt);
      throw new TradeError(x.message, { kind: x.kind, detail: { err: sim.err, logs: sim.logs.slice(-12) } });
    }
    this._guard(pre, sim.post, { side: 'sell', maxTokenDecrease: qty, minSolIncrease: minOutRequired - transferred - FEE_ALLOWANCE - 3_000_000n }, 10_000_000n);
    const signed = await signTransaction(bytes, this.wallet);
    let lastValidBlockHeight = null;
    // The blockhash was valid just now, so it expires within 150 blocks from here.
    try { lastValidBlockHeight = (await this.rpc.call('getBlockHeight', [{ commitment: 'confirmed' }])) + 151; } catch {}
    return this._sendAndSettle({ kind: 'sell', mint, signed, lastValidBlockHeight, pre, tokenAccount, programAt });
  }

  async _sendAndSettle({ kind, mint, signed, lastValidBlockHeight, pre, tokenAccount, programAt }) {
    const sig = transactionId(signed);
    const b64 = toBase64(signed);
    this.onPending({ sig, kind, mint, lastValidBlockHeight, at: Date.now() });
    let uncertain = false;
    try {
      const status = await this._sendUntilFinal(sig, b64, lastValidBlockHeight);
      if (status.err) {
        const x = explainTxError(status.err, programAt);
        throw new TradeError(x.message, { kind: x.kind, sig, detail: { err: status.err } });
      }
      const details = await this._details(sig, tokenAccount, pre);
      return { sig, ...details };
    } catch (e) {
      if (e && typeof e === 'object') e.sent = true;
      if (e instanceof TradeError && e.uncertain) uncertain = true;
      // An expired buy is re-checked for a few minutes anyway, in case a lagging node missed it.
      else if (e instanceof TradeError && e.kind === 'expired' && kind === 'buy') uncertain = true;
      else if (!(e instanceof TradeError)) uncertain = true; // unexpected error after sending: re-check later
      throw e;
    } finally {
