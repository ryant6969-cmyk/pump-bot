    if (!(this.solUsd > 0)) throw new Error("Couldn't get the SOL price yet. Try again in a moment.");
    const lamports = pump.solToLamports(n / this.solUsd);
    this.practice.balance = BigInt(this.practice.balance) + lamports;
    this.log('info', `Added $${n.toLocaleString('en-US')} (${pump.lamportsToSol(lamports).toFixed(3)} SOL) to your practice balance.`);
    this._save();
    this._emit();
    return lamports;
  }

  _applyPendingPractice() {
    const usd = Number(this.settings.pendingPracticeUsd) || 0;
    if (!(usd > 0) || !(this.solUsd > 0)) return;
    this.settings.pendingPracticeUsd = 0;
    this.addPracticeUsd(usd);
  }

  availableLamports(mode = this.settings.mode) {
    return mode === 'practice' ? this.practice.balance : (this.balance ?? 0n);
  }

  _rollDay() {
    const k = dayKey(this.now());
    if (this.daily.day !== k) this.daily = { day: k, real: 0n, practice: 0n };
  }

  // ---------- start / stop ----------

  canStart() {
    if (!this.wallet) return { ok: false, message: 'Set up your bot wallet first.' };
    if (!this.rpc) return { ok: false, message: 'Add your free data key in Settings first.' };
    const rules = this.rules();
    if (this.settings.mode === 'real') {
      const need = rules.tradeSol + rules.keepSolReserve + FEE_BUFFER_SOL;
      const have = pump.lamportsToSol(this.balance ?? 0n);
      if (have < need) return { ok: false, message: `Add SOL to the bot wallet first. One ${rules.tradeSol} SOL trade needs about ${need.toFixed(3)} SOL with fees; it has ${have.toFixed(3)}.` };
    } else if (pump.lamportsToSol(this.practice.balance) < rules.tradeSol + 0.001) {
      return { ok: false, message: 'Your practice balance is too low. Reset it in Settings.' };
    }
    return { ok: true };
  }

  async start() {
    if (this.running) return;
    if (this.settings.mode === 'real') await this.refreshBalance().catch(() => {});
    const c = this.canStart();
    if (!c.ok) throw new Error(c.message);
    this.running = true;
    this.wasRunning = false;
    this.pausedReason = null;
    this.failStreak = 0;
    this.pipeline = { scanned: 0, studied: 0, passed: 0, rejected: 0, bought: 0 };
    this._startFeed();
    this._syncWatches();
    this._ensureLoop();
    const s = STYLES[this.settings.style]?.label || 'Balanced';
    this.log('info', `Bot started: ${this.settings.mode === 'real' ? 'REAL money' : 'Practice'}, ${s} style.`);
    this._save();
  }

  stop() {
    if (!this.running) return;
    this.running = false;
    this.feed?.stop();
    this.feed = null;
    this.feedStatus = { chain: 'off', pumpportal: 'off' };
    for (const c of this.coins.values()) if (c.stage === 'study' || c.stage === 'passed') { c.stage = 'scan'; c.status = null; }
    this._syncWatches();
    this.log('info', 'Bot stopped. It still watches open trades until they are sold.');
    this._save();
  }

  resume() {
    this.pausedReason = null;
    this.failStreak = 0;
    this._clearAlert('paused');
    this._emit();
  }

  _startFeed() {
    if (this.feed) return;
    this.feed = new CoinFeed({
      stream: this.stream,
      WebSocketImpl: this.WebSocketImpl,
      onStatus: (s) => { this.feedStatus = { ...s }; this._emit(); },
      onCoin: (c) => this._addCoin(c),
    });
    this.feed.start();
  }

  /** Called when the app comes back to the screen. */
  async onResume(hiddenMs) {
    if (hiddenMs > 20000) {
      // iOS froze the app: the live connection is probably dead, so open a fresh one
      this.stream?._reconnect();
      if (this.running) { this.feed?.portal?.stop(); this.feed?.portal?.start(); }
    }
    if (hiddenMs > 5000) for (const w of this.wallets) this.refreshWallet(w.address).catch(() => {});
    clearTimeout(this.loopTimer);
    this.loopTimer = null;
    this._ensureLoop();
    if (this.rpc && this.wallet) {
      this.refreshBalance().catch(() => {});
      this.reconcile().catch(() => {});
    }
  }

  // ---------- coins ----------

  async _addCoin(c) {
    const existing = this.coins.get(c.mint);
    if (existing) {
      // the second feed reported it too: fill in anything the first one didn't know
      for (const k of ['creator', 'tokenProgram', 'isMayhemMode', 'devBuySol', 'devBuyTokens', 'createSig']) {
        if ((existing[k] === null || existing[k] === undefined) && c[k] !== null && c[k] !== undefined) existing[k] = c[k];
      }
      this.tapes.get(c.mint)?.setCreator(existing.creator);
      return;
    }
    if (c.update) return;
    const coin = { ...c, curveAddr: null, snaps: [], curve: null, verdict: null, scan: null, holders: null, holderCheckedAt: 0, watching: true, stage: 'scan', studies: 0 };
    delete coin.update;
    this.coins.set(c.mint, coin);
    this.pipeline.scanned++;
    coin.curveAddr = await pump.bondingCurveAddress(c.mint);
    if (this.coins.size > MAX_COINS) this._pruneCoins(this.now(), true);
    this._emit();
  }

  _pruneCoins(now, force = false) {
    const held = new Set([...this.positions.values()].map((p) => p.mint));
    const keep = (c) => held.has(c.mint) || c.stage === 'study' || c.stage === 'passed';
    for (const [m, c] of this.coins) {
      if (keep(c)) continue;
      if (now - c.createdAt > COIN_TTL_MS) this.coins.delete(m);
    }
    if (force && this.coins.size > MAX_COINS) {
      const old = [...this.coins.values()].filter((c) => !keep(c)).sort((a, b) => a.createdAt - b.createdAt);
      for (const c of old.slice(0, this.coins.size - MAX_COINS)) this.coins.delete(c.mint);
    }
  }

  _coinsToWatch(now, capacity) {
    const maxAge = this.rules().entry.maxAgeMin * 60_000;
    const live = [...this.coins.values()].filter((c) => c.curveAddr && (c.stage === 'study' || c.stage === 'passed'));
    const list = [...this.coins.values()].filter((c) => c.curveAddr && c.watching && c.stage !== 'study' && c.stage !== 'passed' && now - c.createdAt <= maxAge);
    // the newest coins first, then the ones with money coming in
    const young = list.filter((c) => now - c.createdAt < 90_000).sort((a, b) => b.createdAt - a.createdAt);
    const rest = list.filter((c) => now - c.createdAt >= 90_000).sort((a, b) => (b.solRaised || 0) - (a.solRaised || 0));
    return [...live, ...young, ...rest].slice(0, Math.max(0, capacity));
  }

  _openPositions(mode = null) {
    return [...this.positions.values()].filter((p) => !mode || p.mode === mode);
  }

  /** Being pickier after losses in a row: extra points the score needs. */
  pickiness(mode = this.settings.mode) {
    return Math.min(15, (this.lossStreak?.[mode] || 0) * 4);
  }

  // ---------- live trades (one subscription per address) ----------

  _tape(mint) {
    let t = this.tapes.get(mint);
    if (!t) {
      const c = this.coins.get(mint);
      const p = this.positions.get('real:' + mint) || this.positions.get('practice:' + mint);
      t = new Tape({ mint, creator: c?.creator || p?.creator || null, ignore: [this.wallet?.address, this.agentAddr] });
      this.tapes.set(mint, t);
    }
    return t;
  }

  /** Subscribe to exactly what's needed right now: studied coins, held coins, tracked wallets. */
  _syncWatches() {
    if (!this.stream || this.disposed) return;
    const want = new Map();
    for (const p of this.positions.values()) if (p.curveAddr && !p.complete) want.set(p.curveAddr, { kind: 'curve', mint: p.mint });
    for (const c of this.coins.values()) if ((c.stage === 'study' || c.stage === 'passed') && c.curveAddr) want.set(c.curveAddr, { kind: 'curve', mint: c.mint });
    for (const w of this.wallets) want.set(w.address, { kind: 'wallet', address: w.address });
    for (const [addr, h] of this.watches) {
      if (want.has(addr)) continue;
      h.unsub();
      this.watches.delete(addr);
      if (h.kind === 'curve' && ![...this.positions.values()].some((p) => p.mint === h.mint)) this.tapes.delete(h.mint);
    }
    for (const [addr, info] of want) {
      if (this.watches.has(addr)) continue;
      const handler = info.kind === 'curve' ? (sig, logs) => this._onCurveLogs(info.mint, sig, logs) : (sig, logs) => this._onWalletLogs(info.address, sig, logs);
      this.watches.set(addr, { ...info, unsub: this.stream.subscribe(addr, handler) });
    }
    const needed = this.running || want.size > 0;
    if (needed && this.stream.stopped) this.stream.start();
    else if (!needed && !this.stream.stopped) this.stream.stop();
  }

  _onCurveLogs(mint, sig, logs) {
    const trades = pump.pumpEventsFromLogs(logs).trades.filter((t) => t.mint === mint);
    if (!trades.length) return;
    const now = this.now();
    const tape = this._tape(mint);
    for (const ev of trades) tape.add(ev, now, sig);
    const ev = trades[trades.length - 1];
    const curve = {
      virtualTokenReserves: ev.virtualTokenReserves, virtualQuoteReserves: ev.virtualSolReserves,
      realTokenReserves: ev.realTokenReserves, realQuoteReserves: ev.realSolReserves, complete: ev.realTokenReserves === 0n,
    };
    for (const mode of ['practice', 'real']) {
      const p = this.positions.get(mode + ':' + mint);
      if (!p || p.state === 'selling') continue;
      // value it from this exact trade, no waiting for the next price check
      if (!curve.complete) {
        p.liveCurve = curve;
        p.lastValueLamports = pump.curveSellLamportsOut(curve, BigInt(p.tokens));
        p.valuedAt = now;
        p.progress = pump.curveProgress(curve);
        if (BigInt(p.peakValueLamports || 0n) < p.lastValueLamports) p.peakValueLamports = p.lastValueLamports;
      }
      this._maybeExit(p, now);
    }
    const c = this.coins.get(mint);
    if (c) c.lastTradeAt = now;
    this._emit();
  }

  // ---------- main loop ----------

  _ensureLoop() {
    if (this.loopTimer) return;
    this.loopTimer = setTimeout(() => this._tick(), 0);
  }

  async _tick() {
    this.loopTimer = null;
    if (this.ticking || this.disposed) return;
    const needed = this.running || this.positions.size > 0;
    if (!needed || !this.rpc) return;
    this.ticking = true;
    try {
      await this._poll();
      this._clearAlert('rpc');
      // every 90 s, re-check the wallet itself (catches anything that changed outside the app)
      if (this.trader && this.now() - (this.lastReconcileAt || 0) > 90_000) {
        this.lastReconcileAt = this.now();
        this.reconcile().catch(() => {});
      }
    } catch (e) {
      if (this.rpc?.failStreak >= 3 || e?.status === 401 || e?.status === 403) {
        this._alert('rpc', 'error', e?.status === 429 ? 'Your free data plan is busy or used up. The bot is slowing down.' : 'Connection problem: ' + (e?.message || 'unknown'));
      }
    } finally {
      this.ticking = false;
    }
    if (!this.loopTimer && !this.disposed && (this.running || this.positions.size > 0)) {
      // back off when the connection is struggling (e.g. the free plan's rate limit)
      const slow = (this.rpc?.failStreak || 0) > 3 ? 4 : 1;
      this.loopTimer = setTimeout(() => this._tick(), this.pollMs * slow);
    }
  }

  async _poll() {
    const now = this.now();
    this._rollDay();
    this._pruneCoins(now);
    const positions = this._openPositions();
    const addrs = [];
    const seen = new Set();
    const add = (a) => { if (a && !seen.has(a) && addrs.length < 100) { seen.add(a); addrs.push(a); } };
    for (const p of positions) add(p.curveAddr);
    const watch = this.running ? this._coinsToWatch(now, MAX_WATCH - addrs.length) : [];
    for (const c of watch) add(c.curveAddr);
    // read each new coin's mint once to learn its token program and name
    const needMint = [...this.coins.values()].filter((c) => !c.tokenProgram && seen.has(c.curveAddr)).slice(0, Math.max(0, 100 - addrs.length));
    for (const c of needMint) add(c.mint);
    if (addrs.length) {
      const res = await this.rpc.call('getMultipleAccounts', [addrs, { encoding: 'base64', commitment: 'confirmed' }]);
      const byAddr = new Map();
      res.value.forEach((a, i) => { if (a) byAddr.set(addrs[i], { owner: a.owner, data: fromBase64(a.data[0]) }); });
      for (const c of needMint) {
        const m = byAddr.get(c.mint);
        if (m && (m.owner === pump.TOKEN || m.owner === pump.TOKEN_2022)) c.tokenProgram = m.owner;
      }
      const t = this.now();
      for (const c of watch) {
        const acc = byAddr.get(c.curveAddr);
        const curve = acc && acc.owner === pump.PUMP ? pump.decodeBondingCurve(acc.data) : null;
        if (!curve) continue;
        this._recordCurve(c, curve, t);
      }
      for (const p of positions) {
        const acc = byAddr.get(p.curveAddr);
        const curve = acc && acc.owner === pump.PUMP ? pump.decodeBondingCurve(acc.data) : null;
        await this._valuePosition(p, curve, t);
      }
      this.lastPollAt = t;
    }
    const t = this.now();
    for (const p of positions) this._maybeExit(p, t);
    if (this.running) {
      this._study(t);
      if (this.settings.autoBuy) this._maybeEnter(t);
    }
    this._syncWatches();
    this._emit();
  }

  _recordCurve(c, curve, t) {
    const mcap = pump.lamportsToSol(pump.curveMarketCapLamports(curve));
    const progress = pump.curveProgress(curve);
    const sol = pump.curveSolRaised(curve);
    const vsl = pump.curvePriceVsLaunch(curve);
    c.curve = { complete: curve.complete, isMayhemMode: curve.isMayhemMode, isCashbackCoin: curve.isCashbackCoin, solPaired: pump.isSolPaired(curve), depth: curve.depth, tokenTotalSupply: curve.tokenTotalSupply };
    if (c.isMayhemMode === null || c.isMayhemMode === undefined) c.isMayhemMode = curve.isMayhemMode;
    if (!c.creator || c.creator === pump.DEFAULT_PUBKEY) { c.creator = curve.creator; this.tapes.get(c.mint)?.setCreator(c.creator); }
    c.snaps.push({ t, mcap, progress, sol, vsl });
    if (c.snaps.length > 120) c.snaps.splice(0, c.snaps.length - 120);
    c.lastMcap = mcap;
    c.lastProgress = progress;
    c.solRaised = sol;
    c.vsLaunch = vsl;
    const peak = Math.max(...c.snaps.map((s) => s.mcap));
    // stop watching coins that died
    const age = t - c.createdAt;
    if (c.stage !== 'study' && c.stage !== 'passed' && ((age > 180_000 && sol < 0.5) || (age > 60_000 && mcap < peak * 0.4) || curve.complete)) c.watching = false;
  }

  async _valuePosition(p, curve, t) {
    if (curve) {
      p.complete = curve.complete;
      p.progress = pump.curveProgress(curve);
      p.mcapSol = pump.lamportsToSol(pump.curveMarketCapLamports(curve));
      if (!p.creator && curve.creator !== pump.DEFAULT_PUBKEY) { p.creator = curve.creator; this.tapes.get(p.mint)?.setCreator(p.creator); }
      if (p.mayhem === undefined) p.mayhem = curve.isMayhemMode;
      if (!curve.complete) {
        p.liveCurve = curve;
        p.lastValueLamports = pump.curveSellLamportsOut(curve, BigInt(p.tokens));
        p.valuedAt = t;
      }
    }
    if (p.complete) {
      const v = await this._poolValue(p.mint, BigInt(p.tokens)).catch(() => null);
      if (v !== null) { p.lastValueLamports = v; p.valuedAt = t; }
    }
    if (p.lastValueLamports !== undefined) {
      if (p.found && !(BigInt(p.costLamports) > 0n)) p.costLamports = p.lastValueLamports;
      if (BigInt(p.peakValueLamports || 0n) < BigInt(p.lastValueLamports)) p.peakValueLamports = p.lastValueLamports;
    }
  }

  async _poolValue(mint, tokens) {
    const hit = this.poolCache.get(mint);
    let pool = hit && this.now() - hit.at < 4000 ? hit : null;
    if (!pool) {
      const addr = await pump.canonicalPoolAddress(mint);
      const r1 = await this.rpc.call('getMultipleAccounts', [[addr], { encoding: 'base64', commitment: 'confirmed' }]);
      const a = r1.value[0];
      const ps = a && a.owner === pump.PUMP_AMM ? pump.decodePool(fromBase64(a.data[0])) : null;
      if (!ps) return null;
      const r2 = await this.rpc.call('getMultipleAccounts', [[ps.poolBaseTokenAccount, ps.poolQuoteTokenAccount], { encoding: 'base64', commitment: 'confirmed' }]);
      const base = r2.value[0] ? pump.decodeTokenAccount(fromBase64(r2.value[0].data[0]))?.amount ?? 0n : 0n;
      const quote = (r2.value[1] ? pump.decodeTokenAccount(fromBase64(r2.value[1].data[0]))?.amount ?? 0n : 0n) + ps.virtualQuoteReserves;
      pool = { base, quote, at: this.now() };
      this.poolCache.set(mint, pool);
    }
    return pump.poolSellLamportsOut(pool.base, pool.quote, tokens);
  }

  // ---------- studying coins ----------

  _judge(c, rules, now) {
    const last = c.snaps[c.snaps.length - 1];
    const recent = c.snaps.filter((x) => x.t >= now - 120_000);
    const peak = recent.length ? Math.max(...recent.map((x) => x.mcap)) : 0;
    return judge({
      tape: this._tape(c.mint), studyStart: c.studyStart, now, coin: c, curve: c.curve || {},
      solRaised: last?.sol, vsLaunch: last?.vsl, progress: last?.progress, peakMcap2m: peak, mcap: last?.mcap,
      rules, pickiness: this.pickiness(), creatorSoldBefore: c.creatorSoldBefore,
    });
  }

  _reject(c, reason, now) {
    // keep the report honest: fresh numbers, and the real reason first
    if (c.studyStart && this.tapes.has(c.mint)) {
      try { c.verdict = this._judge(c, this.rules(), now); } catch { /* keep the last one */ }
    }
    if (c.verdict) c.verdict = { ...c.verdict, ok: false, reason, vetoes: [reason, ...c.verdict.vetoes.filter((x) => x !== reason)] };
    c.stage = 'rejected';
    c.rejectedAt = now;
    c.rejectSol = c.solRaised || 0;
    c.status = reason;
    if (/Creator/.test(reason)) c.noRestudy = true;
    this.pipeline.rejected++;
  }

  _canRestudy(c, now) {
    return !c.noRestudy && c.studies < 3 && now - (c.rejectedAt || 0) > 60_000 && (c.solRaised || 0) - (c.rejectSol || 0) >= 1.5;
  }

  _study(now) {
    const rules = this.rules();
    const mode = this.settings.mode;
    let studying = 0;
    for (const c of this.coins.values()) {
      if (c.stage === 'study') {
        const fatal = fatalDuringStudy(this._tape(c.mint), c.studyStart, now, c);
        if (fatal) { this._reject(c, fatal, now); continue; }
        c.verdict = this._judge(c, rules, now);
        if (now >= c.studyEnd) {
          if (c.verdict.ok) { c.stage = 'passed'; c.passedAt = now; c.status = c.verdict.reason; this.pipeline.passed++; }
          else this._reject(c, c.verdict.reason, now);
        } else { studying++; c.status = 'Studying'; }
      } else if (c.stage === 'passed' && now - c.passedAt > 20_000) {
        this._reject(c, 'Missed the moment', now);
      }
    }
    let slots = MAX_STUDY - studying;
    if (slots <= 0) return;
    const cands = [];
    for (const c of this.coins.values()) {
      if (!c.watching || !c.curve || !c.tokenProgram) continue;
      if (c.stage !== 'scan' && !(c.stage === 'rejected' && this._canRestudy(c, now))) continue;
      if (this.positions.has(mode + ':' + c.mint) || this.bought.has(mode + ':' + c.mint)) continue;
      c.scan = evaluateScan(c, rules, now);
      if (c.stage === 'scan') c.status = c.scan.ok ? null : c.scan.reason;
      if (c.scan.ok) cands.push(c);
    }
    cands.sort((a, b) => (b.scan.inflow20 || 0) - (a.scan.inflow20 || 0));
    for (const c of cands) {
      if (slots-- <= 0) break;
      const mayhem = !!(c.curve?.isMayhemMode || c.isMayhemMode);
      c.stage = 'study';
      c.studies++;
      c.studyStart = now;
      c.studyEnd = now + (mayhem ? rules.mayhemStudySec : rules.studySec) * 1000;
      c.verdict = null;
      c.status = 'Studying';
      this.pipeline.studied++;
    }
  }

  // ---------- buying ----------

  _maybeEnter(now) {
    const rules = this.rules();
    const mode = this.settings.mode;
    this.entryBlock = null;
    if (this.pausedReason) { this.entryBlock = this.pausedReason; return; }
    const mine = this._openPositions(mode).filter((p) => !p.found && !p.copiedFrom);
    if (mine.length >= rules.maxOpen) { this.entryBlock = `Holding ${mine.length} of ${rules.maxOpen} trades`; return; }
    const lossToday = -pump.lamportsToSol(this.daily[mode] || 0n);
    if (lossToday >= rules.dailyLossSol) {
      this.entryBlock = 'Daily loss limit reached';
      this._alert('daily', 'warn', `Today's loss limit (${rules.dailyLossSol} SOL) is reached, so the bot stopped buying until tomorrow. It still sells open trades.`);
      return;
    }
    this._clearAlert('daily');
    const needLamports = pump.solToLamports(rules.tradeSol + (mode === 'real' ? rules.keepSolReserve + FEE_BUFFER_SOL : 0.001));
    if (this.availableLamports(mode) < needLamports) { this.entryBlock = 'Not enough SOL for another trade'; return; }
    if (this.buyInFlight || now - this.lastBuyAt < 8000) return;
    const ready = [...this.coins.values()].filter((c) => c.stage === 'passed' && !this.positions.has(mode + ':' + c.mint) && !this.bought.has(mode + ':' + c.mint));
    if (!ready.length) return;
    // one last look with the newest numbers, right before buying
    for (const c of ready) {
      c.verdict = this._judge(c, rules, now);
      if (!c.verdict.ok) this._reject(c, c.verdict.reason, now);
    }
    const good = ready.filter((c) => c.stage === 'passed').sort((a, b) => b.verdict.score - a.verdict.score);
    if (good.length) this._checkAndBuy(good[0], rules);
  }

  async _checkAndBuy(coin, rules) {
    this.buyInFlight = true;
    coin.status = 'Checking holders';
    this._emit();
    try {
      const h = await this._holderCheck(coin, rules);
      coin.holders = h;
      coin.holderCheckedAt = this.now();
      if (!h.ok) { this._reject(coin, h.reason, this.now()); if (/Creator/.test(h.reason)) coin.noRestudy = true; return; }
      if (!this.running) return;
      coin.status = 'Buying';
      await this._buy(coin.mint, rules.tradeSol, 'auto', { mayhem: !!coin.curve?.isMayhemMode, score: coin.verdict?.score ?? null });
      coin.stage = 'bought';
      coin.status = 'Bought';
      this.pipeline.bought++;
    } catch (e) {
      coin.status = 'Buy failed';
      if (coin.stage === 'passed') coin.stage = 'rejected';
    } finally {
      this.buyInFlight = false;
      this._syncWatches();
      this._emit();
    }
  }

  async _holderCheck(coin, rules) {
    const r = await this.rpc.call('getTokenLargestAccounts', [coin.mint, { commitment: 'confirmed' }]);
    const holders = (r.value || []).map((h) => ({ address: h.address, amount: BigInt(h.amount) }));
    const curveAta = await associatedTokenAddress(coin.curveAddr, coin.mint, coin.tokenProgram);
    const agentAta = this.agentAddr ? await associatedTokenAddress(this.agentAddr, coin.mint, coin.tokenProgram) : null;
    const devAta = coin.creator && coin.creator !== pump.DEFAULT_PUBKEY ? await associatedTokenAddress(coin.creator, coin.mint, coin.tokenProgram) : null;
    return evaluateHolders({
      holders, supply: coin.curve?.tokenTotalSupply || 1_000_000_000_000_000n, excludeAddresses: [curveAta, agentAta],
      devAccount: devAta, devBought: coin.devBuyTokens ? BigInt(coin.devBuyTokens) : null,
    }, rules);
  }

  /** Buy now, from the bot (auto) or from a tap (manual). */
  async manualBuy(mint, sol) {
    mint = String(mint || '').trim();
    if (!isAddress(mint)) throw new Error("That isn't a valid coin address.");
    const amount = Number(sol);
    if (!(amount > 0)) throw new Error('Enter how much SOL to spend.');
    if (!this.wallet || !this.rpc) throw new Error('Finish setup first (wallet and data key).');
    const mode = this.settings.mode;
    if (this.buying.has(mint)) throw new Error('Already buying this coin.');
    if (this.positions.has(mode + ':' + mint)) throw new Error('You already hold this coin. Sell it first.');
    this.buying.add(mint); // claim it before anything async, so a double tap can't buy twice
    try {
      const rules = this.rules();
      const need = pump.solToLamports(amount + (mode === 'real' ? rules.keepSolReserve + FEE_BUFFER_SOL : 0.0001));
      if (mode === 'real') await this.refreshBalance().catch(() => {});
      if (this.availableLamports(mode) < need) throw new Error(`Not enough SOL. This needs about ${pump.lamportsToSol(need).toFixed(3)} SOL with fees.`);
      return await this._buy(mint, amount, 'manual');
    } finally {
      this.buying.delete(mint);
    }
  }

  async _buy(mint, sol, source, extra = {}) {
    const mode = this.settings.mode;
    const id = mode + ':' + mint;
    const rules = this.rules();
    const lamports = pump.solToLamports(sol);
    const coin = this.coins.get(mint);
    this.bought.add(id);
    this.buying.add(mint);
    this.lastBuyAt = this.now();
    let name = coin?.name, symbol = coin?.symbol;
    try {
      let pos;
      if (mode === 'practice') {
        const st = await this._readCoin(mint);
        const c = st.curve;
        if (!c) throw new TradeError("This isn't a pump.fun coin.", { kind: 'unsupported' });
        if (c.complete) throw new TradeError('This coin already graduated. The bot only buys coins still on pump.fun.', { kind: 'unsupported' });
        if (!pump.isSolPaired(c) || c.isCashbackCoin) throw new TradeError("This coin type can't be traded by the bot.", { kind: 'unsupported' });
        const tokens = (pump.curveBuyTokensOut(c, lamports) * PRACTICE_SLIPPAGE) / 100n;
        if (tokens <= 0n) throw new TradeError('Nothing left to buy on this coin.', { kind: 'unsupported' });
        const cost = lamports + PRACTICE_FEE;
        if (this.practice.balance < cost) throw new TradeError('Not enough practice SOL.', { kind: 'funds' });
        this.practice.balance -= cost;
        name = name || st.meta?.name; symbol = symbol || st.meta?.symbol;
        pos = { tokens, costLamports: cost, tokenProgram: st.tokenProgram, via: 'practice', buySig: null, mayhem: !!c.isMayhemMode, creator: c.creator };
      } else {
        const r = await this._queueTrade(() => this.trader.buy({ mint, lamports, slippagePct: rules.buySlippagePct, speed: rules.speed }), 'buy');
        let tokens = r.tokDelta;
        if (tokens === null) {
          // landed, but the exact amounts couldn't be read: use the wallet's balance
          const held = (await this.trader.walletTokens().catch(() => [])).find((t) => t.mint === mint);
          tokens = held ? held.amount : null;
        }
        if (!(tokens > 0n)) throw Object.assign(new TradeError('The buy went through but the coins could not be found yet. The bot will pick them up on its next wallet check.', { kind: 'failed', sig: r.sig }), { sent: true, uncertain: true });
        if (!name) { const st = await this._readCoin(mint).catch(() => null); name = st?.meta?.name; symbol = st?.meta?.symbol; }
        // Cost = SOL that left the wallet, minus the refundable token-account deposit.
        // If that can't be read exactly, or looks wrong, use the amount spent.
        let cost = r.solDelta === null ? null : -r.solDelta - (r.rentDeposit || 0n);
        if (cost === null || cost < lamports / 2n || cost > lamports * 2n) cost = lamports + 100_000n;
        pos = { tokens, costLamports: cost, rentDeposit: r.rentDeposit || 0n, tokenProgram: r.tokenProgram, via: r.via, buySig: r.sig };
        this.failStreak = 0;
        this.refreshBalance().catch(() => {});
      }
      const p = {
        id, mode, mint, name: name || 'Coin ' + short(mint), symbol: symbol || short(mint),
        curveAddr: await pump.bondingCurveAddress(mint), source, managed: true,
        openedAt: this.now(), peakValueLamports: 0n, lastValueLamports: undefined, state: 'open', sellAttempts: 0, nextSellAt: 0,
        creator: coin?.creator || null,
        ...pos, ...extra,
      };
      const existing = this.positions.get(id);
      if (existing) {
        // never overwrite: add to what's already held
        existing.tokens = BigInt(existing.tokens) + BigInt(p.tokens);
        existing.costLamports = BigInt(existing.costLamports || 0n) + BigInt(p.costLamports);
      } else {
        this.positions.set(id, p);
      }
      if (coin) coin.status = 'Bought';
      try { const st = await this._readCoin(mint); await this._valuePosition(p, st.curve, this.now()); } catch { /* valued on the next check */ }
      const why = source === 'copy' ? ` (copying ${this.walletLabel(extra.copiedFrom)})` : extra.score !== undefined && extra.score !== null ? ` (score ${extra.score})` : '';
      this.log('buy', `Bought ${p.symbol} for ${sol} SOL${why}${mode === 'practice' ? ' (practice)' : ''}.`, { mint, sig: p.buySig });
      this._save();
      this._syncWatches();
      this._ensureLoop();
      return p;
    } catch (e) {
      // Allow another try only when we know nothing was bought.
      // ('expired' is not on this list: a lagging node could have hidden a buy that did land)
      const nothingBought = !e?.uncertain && ((e?.name === 'RpcError' && !e?.sent) || (e instanceof TradeError && (e.kind === 'slippage' || (e.kind === 'network' && !e.sent))));
      if (nothingBought) this.bought.delete(id);
      if (mode === 'real' && source === 'auto' && e?.kind !== 'unsupported') {
        this.failStreak++;
        if (this.failStreak >= 3) {
          this.pausedReason = 'Paused after 3 failed buys';
          this._alert('paused', 'error', 'Buying paused after 3 failed buys in a row. Check the activity list, then tap Resume.');
        }
      }
      this.log('error', `Couldn't buy ${symbol || short(mint)}: ${e.message}`, { mint, sig: e.sig || null });
      this._save();
      throw e;
    } finally {
      this.buying.delete(mint);
    }
  }

  /** Name, market cap and progress of any coin (for a pasted address). */
  async lookupCoin(mint) {
    if (!isAddress(mint)) throw new Error("That isn't a coin address.");
    const st = await this._readCoin(mint);
    if (!st.curve) throw new Error("This isn't a pump.fun coin (or it's very old).");
    return {
      name: st.meta?.name, symbol: st.meta?.symbol,
      mcap: pump.lamportsToSol(pump.curveMarketCapLamports(st.curve)),
      progress: pump.curveProgress(st.curve), complete: st.curve.complete,
    };
  }

  async _readCoin(mint) {
    const curveAddr = await pump.bondingCurveAddress(mint);
    const r = await this.rpc.call('getMultipleAccounts', [[curveAddr, mint], { encoding: 'base64', commitment: 'confirmed' }]);
    const [ca, ma] = r.value;
    if (!ma) throw new TradeError("That coin address doesn't exist on Solana.", { kind: 'unsupported' });
    const mintData = fromBase64(ma.data[0]);
    const curve = ca && ca.owner === pump.PUMP ? pump.decodeBondingCurve(fromBase64(ca.data[0])) : null;
    return { curve, tokenProgram: ma.owner, meta: pump.decodeToken2022Metadata(mintData) };
  }

  // ---------- selling ----------

  _maybeExit(p, now) {
    if (p.state === 'selling') return;
    if (p.nextSellAt && now < p.nextSellAt) return;
    if (p.sellRequested) { this._sell(p, p.sellRequested); return; }
    if (!p.managed || p.lastValueLamports === undefined) return;
    if (p.valuedAt && now - p.valuedAt > 20_000 && !p.complete) return; // stale price: don't act on it
    const tape = this.tapes.get(p.mint);
    const flow = tape ? flowSignals(tape, now, { since: p.openedAt }) : null;
    const d = evaluateExit(p, p.lastValueLamports, this.rules(), { progress: p.progress ?? 0, complete: !!p.complete, flow, solUsd: this.solUsd }, now);
    if (d.sell) this._sell(p, d.reason);
  }

  /** Sell part of a position by hand (fraction 0..1). */
  sellPart(id, fraction) {
    const p = this.positions.get(id);
    if (!p) return;
    if (fraction >= 0.9) { this.sellNow(id); return; }
    if (p.state === 'selling') throw new Error('This coin is already being sold. Try again in a moment.');
    this._sellPart(p, fraction, `You sold ${Math.round(fraction * 100)}%`);
  }

  /** " (+$1.23)" for a profit or loss in lamports, when the SOL price is known. */
  _usd(lamports) {
    if (lamports === null || lamports === undefined || !(this.solUsd > 0)) return '';
    const v = (Number(lamports) / 1e9) * this.solUsd;
    return ` (${v >= 0 ? '+' : '−'}$${Math.abs(v).toFixed(2)})`;
  }

  /** Profit or loss right now on open trades (lamports), for the screen. */
  openPnl(mode = this.settings.mode) {
    let pnl = 0n;
    for (const p of this._openPositions(mode)) {
      if (p.lastValueLamports === undefined || p.found) continue;
      pnl += BigInt(p.lastValueLamports) - BigInt(p.costLamports || 0n);
    }
    return pnl;
  }

  sellNow(id) {
    const p = this.positions.get(id);
    if (!p) return;
    p.sellRequested = 'Sold by you';
    p.nextSellAt = 0;
    this._ensureLoop();
    if (p.state !== 'selling') this._sell(p, 'Sold by you');
  }

  sellAll() {
    for (const p of this.positions.values()) { p.sellRequested = 'Sell all'; p.nextSellAt = 0; if (p.state !== 'selling') this._sell(p, 'Sell all'); }
    this._ensureLoop();
  }

  async _sell(p, reason) {
    if (p.state === 'selling') return;
    p.state = 'selling';
    p.sellReason = reason;
    this._emit();
    const rules = this.rules();
    try {
      let proceeds, sig = null, via = 'practice';
      if (p.mode === 'practice') {
        let value = p.lastValueLamports;
        if (value === undefined) value = 0n;
        proceeds = (BigInt(value) * PRACTICE_SLIPPAGE) / 100n - PRACTICE_FEE;
        if (proceeds < 0n) proceeds = 0n;
        this.practice.balance += proceeds;
      } else {
        // more room for the price only after the price actually moved away from us
        const slip = Math.min(60, rules.sellSlippagePct + (p.slipSteps || 0) * 15);
        const r = await this._queueTrade(() => this.trader.sell({ mint: p.mint, tokenProgram: p.tokenProgram, amount: null, slippagePct: slip, speed: rules.speed }), 'sell');
        proceeds = r.solDelta;
        sig = r.sig;
        via = r.via;
        this._queueTrade(() => this.trader.closeEmptyTokenAccount(p.mint, p.tokenProgram), 'sell').then(() => this.refreshBalance()).catch(() => {});
        this.refreshBalance().catch(() => {});
      }
      this._close(p, { proceeds, reason, sig, via });
    } catch (e) {
      p.sellAttempts = (p.sellAttempts || 0) + 1;
      p.lastError = e.message;
      const now = this.now();
      if (e instanceof TradeError && e.kind === 'gone') {
        // Stay "selling" while we check, so nothing else closes it at the same time.
        const landed = await this._landedSell(p).catch(() => null);
        p.goneSeen = (p.goneSeen || 0) + 1;
        if (landed || p.goneSeen >= 2) {
          this._close(p, { proceeds: landed?.solDelta ?? null, reason: landed ? reason : 'Sold outside the bot', sig: landed?.sig || null, via: 'unknown' });
          return;
        }
        // one empty read can be a lagging node: look again shortly
        p.state = 'open';
        p.nextSellAt = now + 4000;
        this._save();
        this._ensureLoop();
        return;
      }
      p.state = 'open';
      p.goneSeen = 0;
      const kind = e?.kind;
      if (kind === 'slippage') { p.slipSteps = (p.slipSteps || 0) + 1; p.nextSellAt = now + 300; }
      else if (kind === 'waiting') p.nextSellAt = now + 5000;
      else if (kind === 'funds') {
        p.nextSellAt = now + 15000;
        this._alert('fees', 'error', 'The bot wallet needs a little SOL (0.005) to pay the network fee for selling. Send some from Phantom.');
      } else p.nextSellAt = now + Math.min(30000, 1500 * 2 ** Math.min(5, p.sellAttempts));
      this.log('error', `Couldn't sell ${p.symbol} yet: ${e.message} Trying again.`, { mint: p.mint, sig: e.sig || null });
      this._save();
      this._ensureLoop();
    }
  }

  _close(p, { proceeds, reason, sig, via }) {
    if (p.closed || this.positions.get(p.id) !== p) return; // already closed
    p.closed = true;
    this.positions.delete(p.id);
    const cost = BigInt(p.costLamports || 0n);
    const pnl = proceeds === null ? null : BigInt(proceeds) - cost;
    if (pnl !== null && !p.found) {
      this._rollDay();
      this.daily[p.mode] = (this.daily[p.mode] || 0n) + pnl;
      if (p.source === 'auto') this.lossStreak[p.mode] = pnl < 0n ? (this.lossStreak[p.mode] || 0) + 1 : 0;
    }
    this.history.unshift({
      id: p.id + ':' + this.now(), mode: p.mode, mint: p.mint, name: p.name, symbol: p.symbol,
      openedAt: p.openedAt, closedAt: this.now(), costLamports: cost, proceedsLamports: proceeds, pnlLamports: pnl,
      reason, buySig: p.buySig || null, sellSig: sig, via, found: !!p.found, source: p.source || null, copiedFrom: p.copiedFrom || null, score: p.score ?? null,
    });
    if (this.history.length > 300) this.history.length = 300;
    queueMicrotask(() => this._syncWatches());
    if (p.mode === 'real') this._clearAlert('fees');
    const pct = pnl !== null && cost > 0n ? (Number(pnl) / Number(cost)) * 100 : null;
    this.log(pnl !== null && pnl >= 0n ? 'win' : 'loss',
      `Sold ${p.symbol}${pct !== null ? ` ${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%` : ''}${this._usd(pnl)} (${reason})${p.mode === 'practice' ? ' (practice)' : ''}.`, { mint: p.mint, sig });
    this._save();
    this._emit();
  }

  /** Sell part of a position (copy trading: the wallet you copy sold part of theirs). */
  async _sellPart(p, fraction, reason) {
    if (p.state === 'selling' || p.closed) return;
    const tokens = BigInt(p.tokens);
    let amount = (tokens * BigInt(Math.round(Math.max(0, Math.min(1, fraction)) * 10000))) / 10000n;
    if (amount <= 0n) return;
    if (amount * 100n >= tokens * 90n) { this._sell(p, reason); return; }
    p.state = 'selling';
    p.sellReason = reason;
    this._emit();
    const rules = this.rules();
    try {
      let proceeds, sig = null, via = 'practice';
      if (p.mode === 'practice') {
        const value = p.liveCurve ? pump.curveSellLamportsOut(p.liveCurve, amount) : (BigInt(p.lastValueLamports ?? 0n) * amount) / tokens;
        proceeds = (value * PRACTICE_SLIPPAGE) / 100n - PRACTICE_FEE;
        if (proceeds < 0n) proceeds = 0n;
        this.practice.balance += proceeds;
      } else {
        const r = await this._queueTrade(() => this.trader.sell({ mint: p.mint, tokenProgram: p.tokenProgram, amount, slippagePct: rules.sellSlippagePct, speed: rules.speed }), 'sell');
        proceeds = r.solDelta;
        sig = r.sig;
        via = r.via;
        if (r.tokensSold > 0n && r.tokensSold <= tokens) amount = r.tokensSold;
        this.refreshBalance().catch(() => {});
      }
      const cost = BigInt(p.costLamports || 0n);
      const costPart = (cost * amount) / tokens;
      const left = tokens - amount;
      p.tokens = left;
      p.costLamports = cost - costPart;
      if (p.peakValueLamports) p.peakValueLamports = (BigInt(p.peakValueLamports) * left) / tokens;
      if (p.lastValueLamports !== undefined) p.lastValueLamports = (BigInt(p.lastValueLamports) * left) / tokens;
      const pnl = proceeds === null ? null : BigInt(proceeds) - costPart;
      if (pnl !== null) { this._rollDay(); this.daily[p.mode] = (this.daily[p.mode] || 0n) + pnl; }
      this.history.unshift({
        id: p.id + ':' + this.now() + ':part', mode: p.mode, mint: p.mint, name: p.name, symbol: p.symbol,
        openedAt: p.openedAt, closedAt: this.now(), costLamports: costPart, proceedsLamports: proceeds, pnlLamports: pnl,
        reason, buySig: p.buySig || null, sellSig: sig, via, found: false, partial: true, source: p.source || null, copiedFrom: p.copiedFrom || null,
      });
      const pct = pnl !== null && costPart > 0n ? (Number(pnl) / Number(costPart)) * 100 : null;
      this.log(pnl !== null && pnl >= 0n ? 'win' : 'loss', `Sold ${Math.round(fraction * 100)}% of ${p.symbol}${pct !== null ? ` ${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%` : ''}${this._usd(pnl)} (${reason})${p.mode === 'practice' ? ' (practice)' : ''}.`, { mint: p.mint, sig });
    } catch (e) {
      this.log('error', `Couldn't sell part of ${p.symbol}: ${e.message}`, { mint: p.mint, sig: e.sig || null });
    } finally {
      if (this.positions.get(p.id) === p && p.state === 'selling') p.state = 'open';
      this._save();
      this._emit();
    }
  }

  async _landedSell(p) {
    const sigs = this.pending.filter((x) => x.mint === p.mint && x.kind === 'sell').map((x) => x.sig);
    for (const sig of sigs) {
      const t = await this.rpc.call('getTransaction', [sig, { encoding: 'json', commitment: 'confirmed', maxSupportedTransactionVersion: 1 }]);
      if (t?.meta && !t.meta.err) {
        this.pending = this.pending.filter((x) => x.sig !== sig);
        return { sig, ...readMeta(t, this.wallet.address, null) };
      }
    }
    return null;
  }

  // ---------- trades run one at a time per lane; sells never wait behind a buy ----------

  _queueTrade(fn, lane = 'buy') {
    const L = this.lanes[lane];
    return new Promise((resolve, reject) => {
      L.jobs.push({ fn, resolve, reject });
      this._drain(L);
    });
  }

  async _drain(L) {
    if (L.busy) return;
    L.busy = true;
    try {
      while (L.jobs.length) {
        const job = L.jobs.shift();
        try { job.resolve(await job.fn()); } catch (e) { job.reject(e); }
      }
    } finally {
      L.busy = false;
    }
  }

  _tradesBusy() {
    return Object.values(this.lanes).some((L) => L.busy || L.jobs.length);
  }

  get draining() { return this._tradesBusy(); }

  // ---------- wallet ----------

  async withdraw(to, sol) {
    to = String(to || '').trim();
    if (!isAddress(to)) throw new Error("That isn't a Solana address. Copy your Phantom address again.");
    if (to === this.wallet?.address) throw new Error("That's the bot wallet itself. Paste your Phantom address.");
    const bal = await this.refreshBalance();
    let lamports = sol === 'max' ? bal - 2_000_000n : pump.solToLamports(sol);
    if (lamports <= 0n) throw new Error('There is nothing to withdraw.');
    if (lamports > bal - 1_000_000n) throw new Error('That is more than the wallet holds (keep about 0.001 SOL for the fee).');
    const r = await this._queueTrade(() => this.trader.withdraw({ to, lamports }), 'buy');
    this.log('info', `Sent ${pump.lamportsToSol(lamports).toFixed(4)} SOL to ${short(to)}.`, { sig: r.sig });
    await this.refreshBalance().catch(() => {});
    return r;
  }

  /** Re-check unconfirmed trades and adopt coins the wallet holds. */
  reconcile() {
    if (!this.trader) return Promise.resolve();
    if (!this.reconcileRun) this.reconcileRun = this._reconcile().finally(() => { this.reconcileRun = null; });
    return this.reconcileRun;
  }

  async _reconcile() {
    this.reconciling = true;
    try {
      const now = this.now();
      if (this.pending.length) {
        const sigs = this.pending.map((x) => x.sig);
        const r = await this.rpc.call('getSignatureStatuses', [sigs, { searchTransactionHistory: true }]);
        const keep = [];
        this.pending.forEach((x, i) => {
          const st = r.value?.[i];
          if (!st && now - x.at < 180_000) keep.push(x);
          else if (st && !st.err && (x.kind === 'sell' || x.kind === 'buy')) keep.push({ ...x, landed: true }); // matched below
        });
        this.pending = keep;
      }
      const tokens = await this.trader.walletTokens();
      const held = new Map(tokens.filter((t) => t.amount > 0n && t.mint !== pump.WSOL).map((t) => [t.mint, t]));
      for (const t of held.values()) {
        const id = 'real:' + t.mint;
        const p = this.positions.get(id);
        if (p) {
          p.missingSeen = 0;
          if (p.state !== 'selling' && BigInt(p.tokens) !== t.amount) {
            // more coins than we booked? a second buy landed after all: add its exact cost
            const extra = t.amount > BigInt(p.tokens) && this.pending.find((x) => x.kind === 'buy' && x.mint === t.mint && x.landed && x.sig !== p.buySig);
            if (extra) {
              const tx = await this.rpc.call('getTransaction', [extra.sig, { encoding: 'json', commitment: 'confirmed', maxSupportedTransactionVersion: 1 }]).catch(() => null);
              if (tx?.meta && !tx.meta.err) {
                const d = readMeta(tx, this.wallet.address, t.ata);
                const add = -d.solDelta - d.rentDeposit;
                if (add > 0n) p.costLamports = BigInt(p.costLamports || 0n) + add;
                this.pending = this.pending.filter((x) => x.sig !== extra.sig);
              }
            }
            p.tokens = t.amount;
          }
          this.pending = this.pending.filter((x) => !(x.kind === 'buy' && x.sig === p.buySig && x.landed));
          continue;
        }
        if (this._tradesBusy() || this.buying.has(t.mint)) continue;
        const meta = await this._readCoin(t.mint).catch(() => null);
        const landedBuy = this.pending.find((x) => x.kind === 'buy' && x.mint === t.mint && x.landed);
        if (landedBuy) {
          // The app closed mid-buy: adopt it as a normal bot trade with its exact cost.
          const tx = await this.rpc.call('getTransaction', [landedBuy.sig, { encoding: 'json', commitment: 'confirmed', maxSupportedTransactionVersion: 1 }]).catch(() => null);
          if (tx?.meta) {
            const d = readMeta(tx, this.wallet.address, t.ata);
            this.pending = this.pending.filter((x) => x.sig !== landedBuy.sig);
            this.bought.add(id);
            this.positions.set(id, {
              id, mode: 'real', mint: t.mint, name: meta?.meta?.name || 'Coin ' + short(t.mint), symbol: meta?.meta?.symbol || short(t.mint),
              curveAddr: await pump.bondingCurveAddress(t.mint), tokenProgram: t.tokenProgram, tokens: t.amount,
              costLamports: -d.solDelta - d.rentDeposit, rentDeposit: d.rentDeposit, buySig: landedBuy.sig, via: 'pump.fun',

    const open = this.bot.positions.size;
    const t = (id, label) => `<button data-action="tab" data-tab="${id}" class="${this.tab === id ? 'on' : ''}" aria-label="${label}">${ICONS[id]}<span>${label}</span>${id === 'trades' && open ? `<span class="count">${open}</span>` : ''}</button>`;
    return `<nav class="tabbar">${t('home', 'Home')}${t('coins', 'Coins')}${t('wallets', 'Wallets')}${t('trades', 'Trades')}${t('settings', 'Settings')}</nav>`;
  }

  renderTab() {
    if (this.tab === 'home') this.renderHome();
    else if (this.tab === 'coins') this.renderCoinsShell();
    else if (this.tab === 'wallets') this.renderWallets();
    else if (this.tab === 'trades') this.renderTrades();
    else this.renderSettings();
  }

  // ---------- Home ----------

  renderHome() {
    const el = document.getElementById('tab');
    if (!el) return;
    const b = this.bot;
    const mode = b.settings.mode;
    const real = mode === 'real';
    const bal = toSol(b.availableLamports(mode));
    const st = b.stats(mode);
    const today = toSol(st.todayLamports);
    const total = toSol(st.totalLamports);
    const openPos = [...b.positions.values()];
    const openPnl = toSol(b.openPnl(mode));
    const alerts = [...b.alerts.values()];
    const statusText = this.powerStatus();
    const feedLive = b.feed?.isLive();
    const pricesOk = b.lastPollAt && Date.now() - b.lastPollAt < 12000;
    const awake = this.wake.held();
    const needAwake = b.running || openPos.length > 0;
    patch(el, `
      <div class="bar">
        <div class="brand">Win Bot<small>pump.fun trading desk</small></div>
        <button class="pill mode" data-action="mode-sheet">${real ? 'REAL' : 'PRACTICE'}</button>
      </div>
      ${this.homeBanners()}
      <div class="card balance">
        <div class="spread"><span class="label">${real ? 'Bot wallet' : 'Practice balance'}</span>${real ? `<button class="btn small" data-action="deposit">Add SOL</button>` : `<button class="btn small" data-action="practice-sheet">Add money</button>`}</div>
        <div class="amount money">${b.solUsd ? this.money(bal) : `${solNum(bal)} <small>SOL</small>`}</div>
        <div class="usd">${real && b.balance === null ? 'Checking balance…' : b.solUsd ? solNum(bal) + ' SOL' : 'Loading the SOL price…'}</div>
        <div class="today">
          <span class="chip ${cls(today)}"><span class="num">Today ${this.money(today, { sign: true })}</span></span>
          <span class="chip ${cls(total)}"><span class="num">All time ${this.money(total, { sign: true })}</span></span>
          ${openPos.length ? `<span class="chip ${cls(openPnl)}"><span class="num">Open now ${this.money(openPnl, { sign: true })}</span></span>` : ''}
          <span class="chip">${st.trades} trades · ${st.wins} wins</span>
        </div>
      </div>
      <div class="power-wrap">
        <button class="power ${b.running ? 'on' : ''}" data-action="power" aria-label="${b.running ? 'Stop the bot' : 'Start the bot'}">
          <span class="p-label">${b.running ? 'Stop' : 'Start'}</span>
          <span class="p-sub">${b.running ? 'bot is running' : real ? 'real money' : 'practice'}</span>
        </button>
        <div class="power-status">${statusText}</div>
        ${b.pausedReason ? `<button class="btn small go" data-action="resume">Resume buying</button>` : ''}
      </div>
      ${this.brainCard()}
      <div class="lights">
        <div class="light">Coin feed<div class="row"><span class="dot ${!b.running ? '' : feedLive ? 'ok' : 'warn'}"></span>${!b.running ? 'Off' : feedLive ? 'Live' : 'Connecting'}</div></div>
        <div class="light">Live trades<div class="row"><span class="dot ${b.alerts.has('rpc') ? 'bad' : b.streamStatus === 'live' ? 'ok' : pricesOk ? 'warn' : ''}"></span>${b.alerts.has('rpc') ? 'Problem' : b.streamStatus === 'live' ? 'Live' : pricesOk ? 'Prices only' : 'Idle'}</div></div>
        <button class="light" data-action="keep-awake" style="text-align:left">Screen<div class="row"><span class="dot ${!needAwake ? '' : awake ? 'ok' : 'warn'}"></span>${!needAwake ? 'Normal' : awake ? 'Stays on' : 'Tap: keep on'}</div></button>
      </div>
      ${alerts.map((a) => `<div class="alert ${esc(a.level)}"><span class="ico">${a.level === 'error' ? '⚠️' : a.level === 'warn' ? '⏸' : 'ℹ️'}</span><div class="grow">${esc(a.message)}</div></div>`).join('')}
      ${needAwake ? `<div class="alert"><span class="ico">📱</span><div class="grow"><strong>Keep Win Bot open on screen.</strong> iPhone pauses apps in the background, so the bot only trades while it's open. Plug your phone in; the screen stays on by itself.</div></div>` : ''}
      ${openPos.length ? `<div class="section-title spread"><span>Open trades</span>${openPos.length > 1 ? '<button class="btn ghost small" data-action="sell-all" style="min-height:24px;padding:0;color:var(--red)">Sell all</button>' : ''}</div><div class="list">${openPos.map((p) => this.posRow(p)).join('')}</div>` : ''}
      <div class="section-title spread"><span>Activity</span>${b.activity.length > 4 ? '<button class="btn ghost small" data-action="activity" style="min-height:24px;padding:0">See all</button>' : ''}</div>
      ${this.activityList(4)}
      <p class="small muted center mt2">Memecoins are extremely risky and most go to zero. Only use SOL you can afford to lose. Not financial advice.</p>
    `);
  }

  homeBanners() {
    const out = [];
    if (this.updateOffer) out.push(`<div class="alert ok"><span class="ico">✨</span><div class="grow"><strong>A new version of Win Bot is ready.</strong> It takes a few seconds; open trades are kept.<div class="row mt"><button class="btn small go" data-action="do-update">Update now</button></div></div></div>`);
    if (!this.store.ok) out.push(`<div class="alert error"><span class="ico">⚠️</span><div class="grow">This browser isn't saving data (Private Browsing?). Open Win Bot in normal Safari or from your Home Screen.</div></div>`);
    const funded = (this.bot.balance ?? 0n) > 0n || [...this.bot.positions.values()].some((p) => p.mode === 'real');
    if (isIos() && !isStandalone() && (funded || !this.a2hsDismissed)) {
      out.push(`<div class="alert ${funded ? 'error' : 'warn'}"><span class="ico">📲</span><div class="grow"><strong>${funded ? 'Your bot wallet lives in this Safari tab.' : 'Add Win Bot to your Home Screen.'}</strong> ${funded
        ? 'Safari can clear website data you haven\u2019t opened for 7 days, and the Home Screen app keeps separate data. Make sure your backup key is saved. To move to the Home Screen app, add it, then choose <em>I have a private key to import</em> there.'
        : `Tap ${ICONS.share} Share, then <em>Add to Home Screen</em>. Safari can clear data from websites you haven't opened in 7 days, so your wallet is safer as a Home Screen app.`}
        ${funded ? '' : '<div class="row mt"><button class="btn small" data-action="dismiss-a2hs">Got it</button></div>'}</div></div>`);
    }
    if (this.bot.wasRunning && !this.bot.running) out.push(`<div class="alert"><span class="ico">⏹</span><div class="grow">The bot stopped when the app was closed. Open trades are still being watched. Tap <strong>Start</strong> to look for new coins again.</div></div>`);
    if (this.bot.settings.mode === 'real' && !this.bot.settings.backupDone) out.push(`<div class="alert error"><span class="ico">🔑</span><div class="grow">You haven't confirmed saving your backup key.<div class="row mt"><button class="btn small" data-action="backup">Back up now</button></div></div></div>`);
    return out.join('');
  }

  powerStatus() {
    const b = this.bot;
    if (!b.running) {
      if (b.positions.size) return `Not looking for new coins. <strong>${b.positions.size} open trade${b.positions.size > 1 ? 's' : ''}</strong> still managed.`;
      return b.settings.mode === 'real' ? 'Tap Start to trade with real SOL.' : 'Tap Start to practice with pretend SOL on live coins.';
    }
    if (b.pausedReason) return esc(b.pausedReason);
    if (b.buyInFlight) return '<strong>A coin passed. Checking holders, then buying…</strong>';
    if (b.entryBlock) return esc(b.entryBlock);
    const br = b.brain();
    if (!b.settings.autoBuy) return 'Auto-buy is off: the bot scores coins, you pick on the Coins tab. It still sells for you.';
    if (br.passed.length) return `<strong>${esc(br.passed[0].symbol)}</strong> passed the study. Buying…`;
    if (br.studying.length) return `Studying <strong>${br.studying.length}</strong> coin${br.studying.length === 1 ? '' : 's'}: reading every trade before it buys.`;
    const watching = [...b.coins.values()].filter((c) => c.watching).length;
    if (!b.feed?.isLive() && !watching) return 'Connecting to the live coin feed…';
    return `Scanning <strong>${watching}</strong> new coin${watching === 1 ? '' : 's'} for real buying.`;
  }

  brainCard() {
    const b = this.bot;
    if (!b.running) return '';
    const br = b.brain();
    const p = br.pipeline;
    const rows = [...br.passed, ...br.studying].slice(0, 4).map((c) => this.studyRow(c)).join('');
    return `<div class="card brain mt">
      <div class="spread"><h3>The bot's study desk</h3>${br.pickiness ? `<span class="badge gold">PICKIER +${br.pickiness}</span>` : '<span class="badge">LIVE</span>'}</div>
      <div class="funnel"><div><b>${p.scanned}</b><span>Scanned</span></div><div class="hi"><b>${br.studying.length}</b><span>Studying</span></div><div><b>${p.passed}</b><span>Passed</span></div><div><b>${p.bought}</b><span>Bought</span></div></div>
      ${rows || `<p class="small muted" style="margin:8px 2px 6px">Watching new coins for real buyers and money coming in. Most coins never qualify for a study.</p>`}
      ${br.pickiness ? `<p class="small muted" style="margin:6px 2px 2px">${br.lossStreak} loss${br.lossStreak === 1 ? '' : 'es'} in a row, so coins need ${br.pickiness} more points until the next win.</p>` : ''}
    </div>`;
  }

  studyRow(c) {
    const now = Date.now();
    const v = c.verdict;
    const total = Math.max(1, (c.studyEnd || now) - (c.studyStart || now));
    const left = Math.max(0, Math.ceil(((c.studyEnd || now) - now) / 1000));
    const why = c.stage === 'passed' ? `Passed with ${v?.score ?? '–'}. Buying…` : v ? (v.ok ? `Looking strong · ${left}s left` : `${v.vetoes[0] || v.reason} · ${left}s left`) : `Reading trades · ${left}s left`;
    return `<button class="study-row" data-action="coin" data-mint="${esc(c.mint)}">${scoreRing(v ? v.score : null, v ? (v.ok ? 'pass' : '') : 'fail')}
      <div><div class="nm">${esc(c.symbol)} ${c.isMayhemMode ? '<span class="badge mayhem">MAYHEM</span>' : ''}</div><div class="why">${esc(why)}</div>${c.stage === 'study' ? `<div class="timer"><i style="width:${(clamp01((now - c.studyStart) / total) * 100).toFixed(0)}%"></i></div>` : ''}</div>
      <div class="right small">${this.mcapText(c.lastMcap)}</div></button>`;
  }

  posRow(p) {
    const cost = toSol(p.costLamports);
    const value = p.lastValueLamports !== undefined ? toSol(p.lastValueLamports) : null;
    const pnl = value !== null ? value - cost : null;
    const pp = value !== null && cost > 0 ? (pnl / cost) * 100 : null;
    const state = p.state === 'selling' ? 'Selling…' : p.found ? 'In wallet' : p.lastError && p.sellAttempts ? 'Retrying sale' : 'Held ' + ago(p.openedAt);
    return `<div class="item posrow"><button class="tap-area" data-action="pos" data-id="${esc(p.id)}">${avatar(p.symbol, p.mint)}
      <div class="grow"><div style="font-weight:650">${esc(p.symbol)} <span class="badge ${p.mode}">${p.mode === 'real' ? 'REAL' : 'PRACTICE'}</span>${p.copiedFrom ? ' <span class="badge copy">COPY</span>' : ''}${p.mayhem ? ' <span class="badge mayhem">MAYHEM</span>' : ''}</div><div class="small muted">${esc(state)}</div></div>
      <div class="val"><div class="${cls(pnl ?? 0)}" style="font-weight:700;font-size:17px">${pnl !== null ? this.money(pnl, { sign: true }) : '…'}</div><div class="small ${cls(pnl ?? 0)}">${pp !== null ? pct(pp) : ''}</div></div></button>
      <button class="btn small danger sellbtn" data-action="sell" data-id="${esc(p.id)}" ${p.state === 'selling' ? 'disabled' : ''}>${p.state === 'selling' ? '…' : 'Sell'}</button></div>`;
  }

  activityList(n) {
    const list = this.bot.activity.slice(0, n);
    if (!list.length) return `<div class="list"><div class="empty"><b>Nothing yet</b>Trades and important events show up here.</div></div>`;
    return `<div class="list">${list.map((a) => `<div class="act"><span class="dot ${esc(a.level)}"></span><div class="grow">${esc(a.message)}${a.sig ? ` <a href="https://solscan.io/tx/${esc(a.sig)}" target="_blank" rel="noopener">View</a>` : ''}</div><time>${ago(a.t)}</time></div>`).join('')}</div>`;
  }

  // ---------- Coins ----------

  renderCoinsShell() {
    const el = document.getElementById('tab');
    el.innerHTML = `
      <h1 class="title">Coins</h1>
      <div class="card tight">
        <div class="field"><label for="paste-mint">Buy a coin you found (paste its address)</label>
          <div class="row"><input id="paste-mint" class="input" placeholder="Coin address" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
          <button class="btn small" data-action="paste-mint">Paste</button></div>
          <button class="btn small mode" data-action="open-pasted" style="width:100%;margin-top:4px">Open coin</button>
        </div>
      </div>
      <div class="row mt" style="margin-bottom:10px"><div class="seg" style="flex:1">
        <button data-action="coin-view" data-view="study" class="${this.coinView === 'study' ? 'on' : ''}">Studied</button>
        <button data-action="coin-view" data-view="hot" class="${this.coinView === 'hot' ? 'on' : ''}">Moving</button>
        <button data-action="coin-view" data-view="new" class="${this.coinView === 'new' ? 'on' : ''}">Newest</button></div></div>
      <div id="coin-head" class="small muted" style="margin:0 4px 8px"></div>
      <div id="coin-list"></div>`;
    this.updateCoins();
  }

  updateCoins() {
    const list = document.getElementById('coin-list');
    if (!list) return;
    const b = this.bot;
    const now = Date.now();
    let coins = [...b.coins.values()];
    const rise = (c) => {
      const s = c.snaps; if (!s || s.length < 2) return 0;
      const last = s[s.length - 1];
      let ref = s[0]; for (const x of s) { if (x.t <= last.t - 60000) ref = x; else break; }
      return ref.mcap > 0 ? (last.mcap / ref.mcap - 1) * 100 : 0;
    };
    const order = { passed: 0, study: 1, bought: 2, rejected: 3 };
    if (this.coinView === 'study') coins = coins.filter((c) => c.verdict || c.stage === 'study' || c.stage === 'passed').sort((a, c) => (order[a.stage] ?? 4) - (order[c.stage] ?? 4) || (c.verdict?.at || c.studyStart || 0) - (a.verdict?.at || a.studyStart || 0));
    else if (this.coinView === 'hot') coins = coins.filter((c) => c.snaps.length >= 2 && c.watching).sort((a, c) => rise(c) - rise(a));
    else coins.sort((a, c) => c.createdAt - a.createdAt);
    coins = coins.slice(0, 60);
    const head = document.getElementById('coin-head');
    const br = b.brain();
    if (head) head.textContent = b.running ? `${br.pipeline.scanned} scanned · ${br.studying.length} studying · ${br.pipeline.passed} passed · ${b.feed?.isLive() ? 'live' : 'connecting…'}` : 'Start the bot on Home to see coins launching live.';
    if (!coins.length) {
      const study = this.coinView === 'study';
      patch(list, `<div class="list"><div class="empty"><b>${!b.running ? 'The coin feed is off' : study ? 'Nothing studied yet' : 'Waiting for coins…'}</b>${!b.running ? 'Tap Start on the Home tab. You can still paste a coin address above.' : study ? 'When a new coin gets real buyers, the bot studies its trades for 45 seconds and scores it. Those coins show up here.' : 'New pump.fun coins appear here within seconds.'}</div></div>`);
      return;
    }
    patch(list, `<div class="list">${coins.map((c) => this.coinRow(c, rise(c), now)).join('')}</div>`);
  }

  coinRow(c, r, now) {
    const held = this.bot.positions.has(this.bot.settings.mode + ':' + c.mint);
    const prog = Math.round((c.lastProgress || 0) * 100);
    const v = c.verdict;
    const stage = held ? ['bought', 'Holding'] : c.stage === 'study' ? ['study', 'Studying'] : c.stage === 'passed' ? ['pass', 'Passed'] : c.stage === 'bought' ? ['bought', 'Bought'] : c.stage === 'rejected' ? ['reject', 'Rejected'] : null;
    let status = held ? 'You hold this coin' : c.status || (c.scan && !c.scan.ok ? c.scan.reason : '') || (c.snaps.length ? '' : 'Loading price…');
    if (c.stage === 'study' && v) status = v.ok ? `Looking strong: score ${v.score}, needs ${v.need}` : v.vetoes[0];
    const tone = held || c.stage === 'passed' || c.stage === 'bought' ? 'good' : c.stage === 'study' ? 'gold' : '';
    return `<button class="coin" data-action="coin" data-mint="${esc(c.mint)}">${v ? scoreRing(v.score, v.ok ? 'pass' : c.stage === 'study' ? '' : 'fail') : avatar(c.symbol, c.mint)}
      <div class="name">${esc(c.name)}<small>${esc(c.symbol)}</small></div>
      <div class="side">${sparkline(c.snaps)}<div class="right">${this.mcapText(c.lastMcap)}</div></div>
      <div class="meta">${stage ? `<span class="stage ${stage[0]}">${stage[1]}</span>` : ''}${c.isMayhemMode ? '<span class="badge mayhem">MAYHEM</span>' : ''}<span>${ago(c.createdAt, now)}</span><span class="rail"><i style="width:${prog}%"></i></span><span class="change ${cls(r)}">${c.snaps.length >= 2 ? pct(r) : ''}</span></div>
      ${status ? `<div class="status ${tone}">${esc(status)}</div>` : ''}</button>`;
  }

  mcapText(sol) {
    if (!sol) return '–';
    if (this.bot.solUsd) {
      const usd = sol * this.bot.solUsd;
      return '$' + (usd >= 1e6 ? (usd / 1e6).toFixed(2) + 'M' : usd >= 1e3 ? (usd / 1e3).toFixed(1) + 'K' : usd.toFixed(0));
    }
    return sol.toFixed(1) + ' SOL';
  }

  // ---------- Wallets ----------

  renderWallets() {
    const el = document.getElementById('tab');
    if (!el) return;
    const b = this.bot;
    const list = b.wallets;
    patch(el, `<h1 class="title">Wallets</h1>
      <div class="card tight">
        <div class="field"><label for="track-input">Track a trader: paste their wallet address, pump.fun profile link, or @username</label>
          <div class="row"><input id="track-input" class="input" placeholder="Address or @username" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="btn small" data-action="paste" data-target="track-input">Paste</button></div>
          <button class="btn go" data-action="track" style="margin-top:6px;min-height:46px" ${this.tracking ? 'disabled' : ''}>${this.tracking ? 'Looking them up…' : 'Track wallet'}</button>
        </div>
      </div>
      ${list.length ? list.map((w) => this.walletCard(w)).join('') : `<div class="list mt"><div class="empty"><b>No wallets yet</b>Add a trader you like. You'll see their pump.fun buys and sells live, and you can copy them.</div></div>`}
      <p class="small muted center mt2">Copy trading buys the same pump.fun coin when they buy (with your amount) and sells when they sell, the same share they sold. Your stop loss still protects you. Copies only run while the bot is started.</p>`);
  }

  walletCard(w) {
    const b = this.bot;
    const name = b.walletLabel(w.address);
    const trades = w.trades.slice(0, 6);
    const now = Date.now();
    const open = [...b.positions.values()].filter((p) => p.copiedFrom === w.address).length;
    return `<div class="card wallet">
      <div class="head">${avatar(name.replace(/^@/, ''), w.address)}<div class="grow" style="flex:1"><div class="who">${esc(name)}</div><div class="addr">${w.username || w.label ? esc(short(w.address)) + ' · ' : ''}${w.balance !== null && w.balance !== undefined ? solNum(toSol(w.balance)) + ' SOL' : 'Loading…'}</div></div>
        <button class="btn small" data-action="wallet-refresh" data-address="${esc(w.address)}" ${w.loading ? 'disabled' : ''}>${w.loading ? '…' : 'Refresh'}</button></div>
      <div class="copybox ${w.copy ? 'on' : ''}">
        <label class="row" style="gap:12px"><div class="grow" style="flex:1"><div style="font-weight:650">Copy their trades</div><div class="small muted">${w.copy ? `Buys ${w.copySol} SOL of each coin they buy${open ? ` · ${open} open` : ''}` : 'Off: just watching'}</div></div>
          <span class="switch"><input type="checkbox" data-wallet-copy="${esc(w.address)}" ${w.copy ? 'checked' : ''}><span></span></span></label>
        ${w.copy ? `<div class="row"><span class="small" style="flex:1">SOL per copied trade</span><div class="stepper"><input data-wallet-sol="${esc(w.address)}" inputmode="decimal" value="${esc(w.copySol)}" aria-label="SOL per copied trade"><span class="small muted">SOL</span></div></div>` : ''}
      </div>
      <div class="wtrades">${trades.length ? trades.map((t) => `<button class="wtrade" style="background:none;border:0;text-align:left;width:100%" data-action="coin" data-mint="${esc(t.mint)}"><span class="side ${t.buy ? 'b' : 's'}">${t.buy ? 'BUY' : 'SELL'}</span><div><div>${esc(t.symbol || short(t.mint))} · ${this.bot.solUsd ? this.money(t.sol) : solNum(t.sol) + ' SOL'}</div>${t.note ? `<div class="note ${/^Copied|^Copying/.test(t.note) ? 'gold' : ''}">${esc(t.note)}</div>` : ''}</div><time>${ago(t.t, now)}</time></button>`).join('')
        : `<p class="small muted" style="margin:6px 2px">${w.loading ? 'Loading their recent trades…' : 'No pump.fun trades seen yet. New ones show up here live.'}</p>`}</div>
      <div class="row mt"><a class="btn small" style="flex:1" href="https://pump.fun/profile/${esc(w.address)}" target="_blank" rel="noopener">pump.fun profile</a><button class="btn small danger" style="flex:1" data-action="wallet-remove" data-address="${esc(w.address)}">Remove</button></div>
    </div>`;
  }

  // ---------- Trades ----------

  renderTrades() {
    const el = document.getElementById('tab');
    if (!el) return;
    const b = this.bot;
    const open = [...b.positions.values()];
    const mode = b.settings.mode;
    let body;
    if (this.tradesView === 'open') {
      const openPnl = toSol(b.openPnl(mode));
      body = open.length ? (`<div class="card tight spread" style="margin-bottom:10px"><span class="muted">Up or down right now</span><b class="${cls(openPnl)}" style="font-size:19px">${this.money(openPnl, { sign: true })}</b></div>`) + open.map((p) => this.posCard(p)).join('') + (open.length > 1 ? `<button class="btn danger mt" data-action="sell-all">Sell everything now</button>` : '')
        : `<div class="list"><div class="empty"><b>No open trades</b>${b.running ? 'The bot buys when a coin passes its rules.' : 'Start the bot on Home, or buy a coin from the Coins tab.'}</div></div>`;
    } else {
      const st = b.stats(mode);
      const rate = st.trades ? Math.round((st.wins / st.trades) * 100) + '%' : '–';
      const hist = b.history.filter((h) => h.mode === mode).slice(0, 100);
      body = `<div class="stats"><div class="stat"><b class="${cls(toSol(st.totalLamports))}">${this.money(toSol(st.totalLamports), { sign: true })}</b><span>Total ${this.bot.solUsd ? '' : 'SOL'}</span></div><div class="stat"><b>${rate}</b><span>Win rate</span></div><div class="stat"><b>${st.trades}</b><span>Trades</span></div></div>
        <div class="section-title">${mode === 'real' ? 'Real' : 'Practice'} trades</div>
        ${hist.length ? `<div class="list">${hist.map((h) => this.histRow(h)).join('')}</div>` : `<div class="list"><div class="empty"><b>No finished trades yet</b>Sold trades show here with their result.</div></div>`}`;
    }
    patch(el, `<h1 class="title">Trades</h1>
      <div class="seg" style="margin-bottom:14px"><button data-action="trades-view" data-view="open" class="${this.tradesView === 'open' ? 'on' : ''}">Open (${open.length})</button><button data-action="trades-view" data-view="history" class="${this.tradesView === 'history' ? 'on' : ''}">History</button></div>
      ${body}`);
  }

  posCard(p) {
    const rules = this.bot.rules();
    const cost = toSol(p.costLamports);
    const value = p.lastValueLamports !== undefined ? toSol(p.lastValueLamports) : null;
    const pnl = value !== null ? value - cost : null;
    const pp = value !== null && cost > 0 ? (pnl / cost) * 100 : null;
    let state;
    if (p.state === 'selling') state = `Selling now (${esc(p.sellReason || '')})…`;
    else if (p.found) state = "Found in the bot wallet. The bot won't sell it unless you tap Sell.";
    else if (p.lastError && p.sellAttempts) state = `Retrying the sale: ${esc(p.lastError)}`;
    else if (!p.managed) state = 'Not managed by the bot';
    else if (p.copiedFrom) state = `Copying ${esc(this.bot.walletLabel(p.copiedFrom))}: sells when they sell. Stop loss ${pct(-rules.stopLossPct)}.`;
    else if (p.mayhem && this.bot.solUsd) state = `Mayhem coin: takes $${rules.mayhemProfitMinUsd}–$${rules.mayhemProfitMaxUsd} profit (more while it's flying), stop loss ${pct(-rules.stopLossPct)}.`;
    else state = `Sells at ${pct(rules.takeProfitPct)} or ${pct(-rules.stopLossPct)}, when sellers take over, or after ${rules.maxHoldMin} min.`;
    return `<div class="card pos">
      <div class="top">${avatar(p.symbol, p.mint)}<div class="grow" style="flex:1"><div style="font-weight:700">${esc(p.name)}</div><div class="small muted">${esc(p.symbol)} · <span class="badge ${p.mode}">${p.mode === 'real' ? 'REAL' : 'PRACTICE'}</span>${p.copiedFrom ? ' <span class="badge copy">COPY</span>' : ''}${p.mayhem ? ' <span class="badge mayhem">MAYHEM</span>' : ''}${p.score !== null && p.score !== undefined ? ` <span class="badge gold">SCORE ${esc(p.score)}</span>` : ''}</div></div>
      <div class="pnl ${cls(pnl ?? 0)}">${pnl !== null ? this.money(pnl, { sign: true }) : '…'}<small>${pp !== null ? pct(pp) + ' · ' + signed(pnl) + ' SOL' : 'pricing…'}</small></div></div>
      <div class="facts"><div class="fact"><b>${this.money(cost)}</b><span>Paid</span></div><div class="fact"><b>${value !== null ? this.money(value) : '–'}</b><span>Worth now</span></div><div class="fact"><b>${p.complete ? 'Graduated' : Math.round((p.progress || 0) * 100) + '%'}</b><span>Curve</span></div></div>
      <div class="state">${state}</div>
      ${this.sellButtons(p)}
      <div class="actions"><a class="btn small" style="flex:1" href="https://pump.fun/coin/${esc(p.mint)}" target="_blank" rel="noopener">Chart</a>${p.buySig ? `<a class="btn small" style="flex:1" href="https://solscan.io/tx/${esc(p.buySig)}" target="_blank" rel="noopener">Solscan</a>` : ''}</div></div>`;
  }

  sellButtons(p) {
    const off = p.state === 'selling' ? 'disabled' : '';
    if (p.state === 'selling') return `<div class="sellrow"><button class="btn danger small" disabled>Selling…</button></div>`;
    return `<div class="sellrow"><button class="btn danger small" data-action="sell-part" data-id="${esc(p.id)}" data-fraction="0.25" ${off}>Sell 25%</button><button class="btn danger small" data-action="sell-part" data-id="${esc(p.id)}" data-fraction="0.5" ${off}>Sell 50%</button><button class="btn danger small strong" data-action="sell" data-id="${esc(p.id)}" ${off}>Sell all</button></div>`;
  }

  histRow(h) {
    const pnl = h.pnlLamports === null ? null : toSol(h.pnlLamports);
    const cost = toSol(h.costLamports);
    const pp = pnl !== null && cost > 0 ? (pnl / cost) * 100 : null;
    return `<button class="item" data-action="hist" data-id="${esc(h.id)}">${avatar(h.symbol, h.mint)}
      <div class="grow"><div style="font-weight:650">${esc(h.symbol)}${h.partial ? ' <span class="badge">PART</span>' : ''}${h.copiedFrom ? ' <span class="badge copy">COPY</span>' : ''}</div><div class="small muted">${esc(h.reason)} · ${agoText(h.closedAt)}</div></div>
      <div class="val"><div class="${cls(pnl ?? 0)}" style="font-weight:700">${pnl !== null ? this.money(pnl, { sign: true }) : '?'}</div><div class="small ${cls(pnl ?? 0)}">${pp !== null ? pct(pp) : 'unknown'}</div></div></button>`;
  }

        ${num('mayhemStudySec', 'Study mayhem coins for', 'sec', 5)}

  updateSettingsLive() {
    const b = this.bot;
    const set = (id, html) => { const e = document.getElementById(id); if (e && e.innerHTML !== html) e.innerHTML = html; };
    set('set-balance', b.balance === null ? '–' : solNum(toSol(b.balance)) + ' SOL');
    set('set-practice', solNum(toSol(b.practice.balance)) + ' SOL' + (b.solUsd ? ` <span class="small">($${(toSol(b.practice.balance) * b.solUsd).toLocaleString('en-US', { maximumFractionDigits: 0 })})</span>` : ''));
    const key = b.settings.rpcInput || '';
    set('set-key', key ? esc(b.rpcInfo ? b.rpcInfo.label + ' · ' + (key.length > 10 ? '••••' + key.slice(-4) : '••••') : "Not valid. Tap to fix.") : 'Not set');
    set('set-rpc', !b.rpc ? 'Not set' : b.alerts.has('rpc') ? '<span class="down">Problem</span>' : b.rpc.lastOkAt ? '<span class="up">Connected</span>' : 'Ready');
    const f = b.feedStatus;
    set('set-feed', !b.running ? 'Off' : `${f.chain === 'live' ? '<span class="up">Solana live</span>' : 'Solana ' + esc(f.chain)} · ${f.pumpportal === 'live' ? '<span class="up">PumpPortal live</span>' : 'PumpPortal ' + esc(f.pumpportal)}`);
    const pp = b.trader?.pumpPortalWorks;
    set('set-pp', pp === true ? '<span class="up">Works</span>' : pp === false ? '<span class="down">Blocked on this phone</span>' : 'Not needed yet');
  }

    const steps = 5;

    if (w.step === 0) {
      body = `<div class="hero"><div class="logo" role="img" aria-label="Win Bot"></div><h1>Win Bot</h1><p>A pump.fun trading bot that studies every coin before it buys.</p></div>

          <div class="point"><span class="n">3</span><p><strong>Paste it here</strong></p></div>
        </div>
        <div class="field mt"><div class="row"><input id="wiz-key" class="input" placeholder="Helius API key" value="${esc(w.key)}" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn small" data-action="wiz-paste-key">Paste</button></div></div>
        ${t ? `<div class="alert ${t.ok ? 'ok' : 'error'}"><span class="ico">${t.ok ? '✅' : '⚠️'}</span><div class="grow">${esc(t.message)}</div></div>` : ''}`;
      foot = t?.ok ? `<button class="btn go" data-action="wiz-next">Continue</button>` : `<button class="btn primary" data-action="wiz-test-key" ${w.busy ? 'disabled' : ''}>${w.busy ? 'Testing…' : 'Test key'}</button>`;
      foot += `<button class="btn ghost" data-action="wiz-back">Back</button>`;
    } else if (w.step === 2) {

        <p class="small muted">Set Win Bot up before (for example in Safari)? Choose <strong>I have a private key to import</strong> and paste that wallet's backup key.</p>
        ${w.importing ? `<div class="field mt"><label for="wiz-import">Private key (from Phantom: Settings → your account → Show Private Key)</label><textarea id="wiz-import" class="input" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste a private key"></textarea></div>
          <div class="btn-row mt"><button class="btn" data-action="wiz-paste-import">Paste</button><button class="btn primary" data-action="wiz-import">Import</button></div>` : ''}`;
      foot = w.importing ? `<button class="btn ghost" data-action="wiz-import-toggle">Create a new wallet instead</button>`
        : `<button class="btn go" data-action="wiz-create" ${w.busy ? 'disabled' : ''}>Create a new wallet</button><button class="btn" data-action="wiz-import-toggle">I have a private key to import</button>`;
      foot += `<button class="btn ghost" data-action="wiz-back">Back</button>`;
    } else if (w.step === 3) {
      const secret = b.exportSecret() || '';
      body = `<h1 class="title small">Save your backup key</h1><p class="sub" style="margin-top:0">This key <strong>is</strong> the wallet. If you delete the app or lose your phone, it's the only way to get your SOL back.</p>
        <div class="secret ${w.showKey ? '' : 'hidden-key'}"><div class="mono">${esc(secret)}</div></div>
